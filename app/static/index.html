    mandatory_skills: (row.technologies || []).filter(t => t.importance === "MANDATORY").map(t => t.technology_name),
    preferred_skills: (row.technologies || []).filter(t => t.importance === "PREFERRED").map(t => t.technology_name),
  });
  const [e, setE] = useState(null), [busy, setBusy] = useState("");
  const set = (k, v) => setP(o => ({ ...o, [k]: v }));

  // Re-reading the JD replaces the parse; the row keeps its identity.
  const reparse = async () => {
    setBusy("reparse"); setE(null);
    try {
      const r = jd !== row.raw_jd_text
        ? await api(`/requirements/${row.id}`, { method: "PATCH", body: { raw_jd_text: jd } })
        : await api(`/requirements/${row.id}/reparse`, { method: "POST" });
      setP({
        role: r.parsed_role || "",
        min_experience_years: r.min_experience_years ?? "",
        max_experience_years: r.max_experience_years ?? "",
        location: r.location || "", domain: r.domain || "",
        responsibilities: r.responsibilities || [],
        other_requirements: r.other_requirements || [],
        mandatory_skills: (r.technologies || []).filter(t => t.importance === "MANDATORY").map(t => t.technology_name),
        preferred_skills: (r.technologies || []).filter(t => t.importance === "PREFERRED").map(t => t.technology_name),
      });
    } catch (x) { setE(x.message); } finally { setBusy(""); }
  };

  const save = async () => {
    setBusy("save"); setE(null);
    const num = v => (v === "" || v == null ? null : Number(v));
    try {
      if (jd !== row.raw_jd_text) {
        // Text first, so the re-parse it triggers is then overwritten by the
        // user's own corrections below rather than the other way round.
        await api(`/requirements/${row.id}`, { method: "PATCH", body: { raw_jd_text: jd } });
      }
      await api(`/requirements/${row.id}`, {
        method: "PATCH",
        body: {
          template_id: tpl || null,
          status,
          parsed: {
            role: p.role || null,
            min_experience_years: num(p.min_experience_years),
            max_experience_years: num(p.max_experience_years),
            location: p.location || null,
            domain: p.domain || null,
            responsibilities: p.responsibilities,
            other_requirements: p.other_requirements,
            mandatory_skills: p.mandatory_skills,
            preferred_skills: p.preferred_skills,
          },
        },
      });
      onDone();
    } catch (x) { setE(x.message); } finally { setBusy(""); }
  };

  const del = async () => {
    setBusy("del"); setE(null);
    try { await api(`/requirements/${row.id}`, { method: "DELETE" }); onDone(); }
    catch (x) { setE(x.message); } finally { setBusy(""); }
  };

  const List = ({ k, label }) =>
    <div className="grow"><label>{label} <span className="subtle">(one per line)</span></label>
      <textarea style={{ minHeight: 62 }} value={(p[k] || []).join("\n")}
        onChange={ev => set(k, ev.target.value.split("\n").map(x => x.trim()).filter(Boolean))} /></div>;

  return <div className="modal-bg" onClick={ev => ev.target === ev.currentTarget && onCancel()}>
    <div className="modal">
      <h3>{row.reference_code} <span className="subtle">stored JD</span></h3>
      <Err e={e} />

      <div className="row" style={{ marginBottom: 4 }}>
        <div><label>Vendor</label><b>{row.vendor_name}</b>
          <div className="subtle">A requirement belongs to one vendor — create a new JD to target another.</div></div>
        <div><label>Parsed by</label><b>{row.parse_model || "—"}</b></div>
        <div><label>Confirmed</label><Chip v={row.is_confirmed === "true" ? "APPROVED" : "OPEN"} /></div>
      </div>

      <div className="row">
        <div className="grow" style={{ maxWidth: 300 }}>
          <label>Template</label>
          <select value={tpl} onChange={ev => setTpl(ev.target.value)}>
            <option value="">(none)</option>
            <RefOptions path="/resume-templates" labelField="name" />
          </select>
        </div>
        <div className="grow" style={{ maxWidth: 200 }}>
          <label>Status</label>
          <select value={status} onChange={ev => setStatus(ev.target.value)}>
            {["OPEN", "IN_PROGRESS", "SUBMITTED", "CLOSED", "CANCELLED"].map(x =>
              <option key={x} value={x}>{x}</option>)}
          </select>
        </div>
      </div>

      <div className="row"><div className="grow">
        <label>Original JD — retained verbatim</label>
        <textarea style={{ minHeight: 150 }} value={jd} onChange={ev => setJd(ev.target.value)} />
        <div style={{ marginTop: 8, display: "flex", gap: 8, alignItems: "center" }}>
          <Btn busy={busy === "reparse"} className="btn sec sm" onClick={reparse}>Re-read JD with AI</Btn>
          <span className="subtle">Replaces the parsed fields below. Your edits win if you save afterwards.</span>
        </div>
      </div></div>

      <h3 style={{ marginTop: 18 }}>Parsed information — correctable</h3>
      <div className="row">
        <div className="grow" style={{ maxWidth: 240 }}><label>Role</label>
          <input value={p.role} onChange={ev => set("role", ev.target.value)} /></div>
        <div className="grow" style={{ maxWidth: 130 }}><label>Min exp (yrs)</label>
          <input type="number" step="any" value={p.min_experience_years}
            onChange={ev => set("min_experience_years", ev.target.value)} /></div>
        <div className="grow" style={{ maxWidth: 130 }}><label>Max exp (yrs)</label>
          <input type="number" step="any" value={p.max_experience_years}
            onChange={ev => set("max_experience_years", ev.target.value)} /></div>
        <div className="grow" style={{ maxWidth: 200 }}><label>Location</label>
          <input value={p.location} onChange={ev => set("location", ev.target.value)} /></div>
        <div className="grow" style={{ maxWidth: 200 }}><label>Domain</label>
          <input value={p.domain} onChange={ev => set("domain", ev.target.value)} /></div>
      </div>

      <div className="row">
        <List k="mandatory_skills" label="Mandatory skills" />
        <List k="preferred_skills" label="Preferred skills" />
      </div>
      <div className="row">
        <List k="responsibilities" label="Responsibilities" />
        <List k="other_requirements" label="Other requirements" />
      </div>
      <div className="fmt-note">
        Saving rewrites the MANDATORY / PREFERRED split for this JD only. Importance
        belongs to the requirement, never to the technology master.
      </div>

      <div className="modal-bar">
        <Btn busy={busy === "save"} onClick={save}>Save changes</Btn>
        <button className="btn sec" onClick={onCancel}>Cancel</button>
        <Btn busy={busy === "del"} className="btn sec" style={{ marginLeft: "auto", color: "var(--crit)" }}
          onClick={del}>Delete JD</Btn>
      </div>
    </div>
  </div>;
}

/* <option> list for any master collection, used inside a <select> */
function RefOptions({ path, labelField }) {
  const { d } = useAsync(() => api(path, { params: { limit: 200 } }).then(list), [path]);
  return <>{list(d).map(o => <option key={o.id} value={o.id}>{o[labelField]}</option>)}</>;
}


/* ─────────────────── drill-downs: the question the list makes you ask ───────

   A knowledge base is only useful if you can walk it. Each of these answers the
   follow-up question its list provokes — a person to their resume history, a
   role to the people who hold it, a technology to who is actually deep in it —
   and each is one request, ordered server-side. */
function Drawer({ title, subtitle, onClose, children }) {
  useEffect(() => {
    const esc = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [onClose]);
  return <div className="modal-bg" onClick={ev => ev.target === ev.currentTarget && onClose()}>
    <div className="modal" style={{ maxWidth: 860, width: "92vw" }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
        <h3 style={{ margin: 0 }}>{title}</h3>
        {subtitle && <span className="subtle">{subtitle}</span>}
        <button className="btn sec sm" style={{ marginLeft: "auto" }} onClick={onClose}>Close</button>
      </div>
      <div style={{ marginTop: 14, maxHeight: "68vh", overflowY: "auto" }}>{children}</div>
    </div>
  </div>;
}

function Loading({ of }) { return <div className="empty">Loading {of}…</div>; }

/* §28/§29 — the two questions a person in the bank actually raises.

   Which resumes exist for them, and where do they stand with each vendor.
   Nothing else: a person is an identity, and their skills and history are
   properties of the shared bank rather than of the row you clicked.

   Neither tab prints a vendor-facing outcome. Whether a submission was accepted
   or rejected is the vendor's verdict on one submission, not a property of the
   person, and printing it here invites reading it as one. What this view
   answers is what was built, for whom, and who currently holds them. */
function PersonDrawer({ person, onClose }) {
  const [tab, setTab] = useState("resumes");
  const resumes = useAsync(() => api(`/profiles/${person.id}/resumes`), [person.id]);
  const status  = useAsync(() => api(`/profiles/${person.id}/vendor-status`).then(list), [person.id]);

  // Three questions, three tabs, and they are genuinely different questions:
  // what have we built for this person, who has them RIGHT NOW, and who has
  // had them before. Splitting them is what stops one table trying to answer
  // all three with a status column the reader has to interpret.
  const vendorRows = list(status.d);
  const engaged = vendorRows.filter(r => r.status === "ENGAGED");
  const released = vendorRows.filter(r => r.status === "RELEASED");

  return <Drawer title={person.full_name} onClose={onClose}>
    <div className="rtabs" style={{ marginBottom: 12 }}>
      <button className={tab === "resumes" ? "on" : ""} onClick={() => setTab("resumes")}>
        Resumes{resumes.d ? ` (${resumes.d.count})` : ""}
      </button>
      <button className={tab === "vendors" ? "on" : ""} onClick={() => setTab("vendors")}>
        Vendor status{status.d ? ` (${engaged.length})` : ""}
      </button>
      <button className={tab === "past" ? "on" : ""} onClick={() => setTab("past")}>
        Past vendors{status.d ? ` (${released.length})` : ""}
      </button>
    </div>

    {/* Approved resumes only — the endpoint's own default. A session someone
        abandoned produced no document, so listing it would put a row with
        nothing to download beside rows that have one. */}
    {tab === "resumes" && (resumes.l ? <Loading of="resume history" /> :
      !resumes.d?.resumes?.length ? <div className="empty">No resume has been built for this person yet.</div> :
      <div className="scroll"><table>
        <thead><tr><th>Ref</th><th>Role</th><th>Vendor</th><th>V</th><th>Download</th></tr></thead>
        <tbody>{resumes.d.resumes.map(r =>
          <tr key={r.session_id}>
            <td className="mono">{r.reference_code || "—"}</td>
            <td>{r.role || "—"}</td>
            <td>{r.vendor_name || "—"}</td>
            <td>v{r.version_no}<span className="subtle"> /{r.version_count}</span></td>
            <td style={{ whiteSpace: "nowrap" }}>
              {r.files.length
                ? r.files.map(f =>
                    <button key={f.id} className="btn sec sm" style={{ marginRight: 4 }}
                            onClick={() => download(f.id, f.file_name)}>{f.file_format}</button>)
                : <span className="subtle">not rendered</span>}
            </td>
          </tr>)}</tbody>
      </table></div>)}

    {/* Who has this person RIGHT NOW. Only ENGAGED: the other six statuses are
        stages of putting somebody forward, not a vendor working with them, and
        listing them here made "who is this person placed with" a question the
        reader had to answer by interpreting a status column. A profile in the
        middle of a composition shows an empty tab, which is the honest answer
        — nobody has them yet. */}
    {tab === "vendors" && (status.l ? <Loading of="vendor status" /> :
      !engaged.length
        ? <div className="empty">
            No vendor is engaged with this profile right now.
          </div>
        : <div className="scroll"><table>
            <thead><tr>
              <th>Vendor</th><th>Status</th><th>Resumes</th><th>Engaged since</th>
            </tr></thead>
            <tbody>{engaged.map(row => {
              const built = (resumes.d?.resumes || []).filter(r => r.vendor_name === row.vendor_name).length;
              return <tr key={row.id}>
                <td><b>{row.vendor_name || "—"}</b></td>
                <td><Chip v={row.status} /></td>
                <td className="mono">{built || "—"}</td>
                <td className="subtle">
                  {(row.engagement_start || "—").toString().slice(0, 10)}
                </td>
              </tr>;
            })}</tbody>
          </table></div>)}

    {/* Who HAS had this person. RELEASED is the end of an engagement and is
        final for that vendor (see ProfileVendorStatusEnum.is_selectable), so
        this is the work history: engagement_start is written by mark_engaged
        and never cleared afterwards, and engagement_end is stamped on release,
        which is what lets the period print here long after the fact. */}
    {tab === "past" && (status.l ? <Loading of="past vendors" /> :
      !released.length
        ? <div className="empty">
            This profile has not been released from any vendor.
          </div>
        : <div className="scroll"><table>
            <thead><tr>
              <th>Vendor</th><th>Resumes</th><th>Engaged</th><th>Released</th>
            </tr></thead>
            <tbody>{released.map(row => {
              const built = (resumes.d?.resumes || []).filter(r => r.vendor_name === row.vendor_name).length;
              const start = (row.engagement_start || "").toString().slice(0, 10);
              const end = (row.engagement_end || "").toString().slice(0, 10);
              return <tr key={row.id}>
                <td><b>{row.vendor_name || "—"}</b></td>
                <td className="mono">{built || "—"}</td>
                <td className="subtle">{start || "—"}</td>
                <td className="subtle">{end || "—"}</td>
              </tr>;
            })}</tbody>
          </table></div>)}
  </Drawer>;
}

/* §10 — a role, and every resume built under it.

   A role is logged the moment a JD asks for it, so the question it raises is
   what came of it: who we put forward under this title and to which vendor.
   Not a leaderboard of the people who hold it — this platform does not rank
   candidates (§7, §42), and a list ordered by seniority is a ranking whatever
   the column is called. */
function RoleDrawer({ row, onClose }) {
  const d = useAsync(() => api(`/profile-types/${row.id}/resumes`), [row.id]);
  return <Drawer title={row.name} subtitle="role" onClose={onClose}>
    {d.l ? <Loading of="resumes" /> :
     !d.d?.resumes?.length
       ? <div className="empty">No resume has been built under this role yet.</div>
       : <div className="scroll"><table>
           <thead><tr>
             <th>Ref</th><th>Person</th><th>Vendor</th><th>JD</th>
             <th>Status</th><th>V</th><th>Download</th>
           </tr></thead>
           <tbody>{d.d.resumes.map(r =>
             <tr key={r.session_id}>
               <td className="mono">{r.reference_code || "—"}</td>
               <td><b>{r.person_name}</b></td>
               <td>{r.vendor_name}</td>
               <td className="mono subtle">{r.requirement_code || "—"}</td>
               <td><Chip v={r.status} /></td>
               <td>v{r.version_no}</td>
               <td style={{ whiteSpace: "nowrap" }}>
                 {r.files.length
                   ? r.files.map(f =>
                       <button key={f.id} className="btn sec sm" style={{ marginRight: 4 }}
                               onClick={() => download(f.id, f.file_name)}>{f.file_format}</button>)
                   : <span className="subtle">not rendered</span>}
               </td>
             </tr>)}</tbody>
         </table></div>}
  </Drawer>;
}

/* §13 — a technology, and who is deepest in it. Ordered on years in THAT
   technology, assessed at profile import, not on career length. */
function TechDrawer({ row, onClose }) {
  const d = useAsync(() => api(`/technologies/${row.id}/people`), [row.id]);
  return <Drawer title={row.name}
                 subtitle={[row.category, row.first_release_date && `released ${row.first_release_date}`]
                   .filter(Boolean).join(" · ")}
                 onClose={onClose}>
    {d.l ? <Loading of="people" /> :
     !d.d?.people?.length ? <div className="empty">Nobody has this technology recorded.</div> :
     <div className="scroll"><table>
       <thead><tr><th>#</th><th>Name</th><th>Years</th><th>Proficiency</th><th>Primary</th><th>How this was judged</th></tr></thead>
       <tbody>{d.d.people.map((p, i) =>
         <tr key={p.person_id}>
           <td className="mono subtle">{i + 1}</td>
           <td><b>{p.full_name}</b><div className="subtle" style={{ fontSize: 12 }}>{p.current_designation || ""}</div></td>
           <td className="mono">{p.years_of_experience ?? "—"}</td>
           <td>{p.proficiency || "—"}</td>
           <td>{p.is_primary ? "Yes" : "—"}</td>
           <td className="subtle" style={{ fontSize: 12, maxWidth: 280 }}>{p.basis || "—"}</td>
         </tr>)}</tbody>
     </table></div>}
  </Drawer>;
}

/* One vendor's whole history, opened from the Knowledge base. The tracking
   board answers "what needs doing across every vendor"; this answers "what has
   passed between us and this one", which is a different question and wants a
   different shape — a list of everything sent, not one row per person. */
function VendorDrawer({ row, onClose }) {
  const [tab, setTab] = useState("sent");
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState(null);
  const d = useAsync(() => api(`/vendor-tracking/${row.id}/detail`), [row.id]);

  // RELEASED is terminal by design — nothing in the ordinary flow reopens it.
  // This is the deliberate exception, and it lives here rather than in the
  // status picker because it is a decision about a past engagement, not the
  // next step of a live one.
  const reopen = async person => {
    if (!confirm(`Make ${person.person_name} available to ${row.name} again? `+
                 `The engagement dates stay on record — this only makes them offerable.`)) return;
    setBusy(person.person_id); setErr(null);
    try {
      await api(`/vendor-tracking/${row.id}/profiles/${person.person_id}/reopen`, { method: "POST" });
      d.reload();
    } catch (x) { setErr(x.message); } finally { setBusy(""); }
  };

  const sent = d.d?.submissions || [], engaged = d.d?.engaged || [], past = d.d?.past || [];

  return <Drawer title={row.name} onClose={onClose}>
    <div className="rtabs" style={{ marginBottom: 12 }}>
      <button className={tab === "sent" ? "on" : ""} onClick={() => setTab("sent")}>
        Resumes sent{d.d ? ` (${sent.length})` : ""}
      </button>
      <button className={tab === "engaged" ? "on" : ""} onClick={() => setTab("engaged")}>
        Engaged now{d.d ? ` (${engaged.length})` : ""}
      </button>
      <button className={tab === "past" ? "on" : ""} onClick={() => setTab("past")}>
        Past profiles{d.d ? ` (${past.length})` : ""}
      </button>
    </div>
    <Err e={err} />
    <Err e={d.e} />

    {/* Every submission ever made, not the latest per person: a person put
        forward three times against three JDs is three rows, because that is
        three things that were sent. */}
    {tab === "sent" && (d.l ? <Loading of="submissions" /> :
      !sent.length ? <div className="empty">Nothing has been sent to this vendor yet.</div> :
      <div className="scroll"><table>
        <thead><tr><th>Submission</th><th>Profile</th><th>JD</th><th>Role</th><th>Status</th></tr></thead>
        <tbody>{sent.map(s =>
          <tr key={s.submission_id}>
            <td className="mono" style={{ fontSize: 12, whiteSpace: "nowrap" }}>
              {s.reference_code || "—"}{s.version_no ? <span className="subtle"> · v{s.version_no}</span> : null}
            </td>
            <td style={{ whiteSpace: "nowrap" }}><b>{s.person_name}</b></td>
            <td className="mono" style={{ fontSize: 12 }}>
              {s.requirement_id
                ? <button className="linky" style={{ fontSize: 12 }}
                          onClick={() => { location.hash = hashFor("jd", s.requirement_id); }}>
                    {s.requirement_code || "—"}
                  </button>
                : "—"}
            </td>
            <td>{s.role || "—"}</td>
            <td><Chip v={s.status} /></td>
          </tr>)}</tbody>
      </table></div>)}

    {tab === "engaged" && (d.l ? <Loading of="engagements" /> :
      !engaged.length ? <div className="empty">Nobody is engaged with this vendor right now.</div> :
      <div className="scroll"><table>
        <thead><tr><th>Profile</th><th>Engagement</th><th>Since</th><th>Put forward for</th></tr></thead>
        <tbody>{engaged.map(e =>
          <tr key={e.person_id}>
            <td><b>{e.person_name}</b></td>
            <td>{e.engagement_label || "—"}</td>
            <td className="mono" style={{ fontSize: 12 }}>{(e.engagement_start || "—").toString().slice(0, 10)}</td>
            <td className="subtle" style={{ fontSize: 12 }}>
              {e.requirement_code ? `${e.requirement_code} · ${e.role || ""}` : "—"}
            </td>
          </tr>)}</tbody>
      </table></div>)}

    {/* Released, and therefore not offerable to this vendor — until somebody
        decides otherwise here. */}
    {tab === "past" && (d.l ? <Loading of="past engagements" /> :
      !past.length ? <div className="empty">No past engagements with this vendor.</div> :
      <div className="scroll"><table>
        <thead><tr><th>Profile</th><th>Engagement</th><th>From</th><th>To</th><th></th></tr></thead>
        <tbody>{past.map(e =>
          <tr key={e.person_id}>
            <td><b>{e.person_name}</b>
              {e.requirement_code &&
                <div className="subtle mono" style={{ fontSize: 11.5 }}>{e.requirement_code}</div>}
            </td>
            <td>{e.engagement_label || e.role || "—"}</td>
            <td className="mono" style={{ fontSize: 12 }}>{(e.engagement_start || "—").toString().slice(0, 10)}</td>
            <td className="mono" style={{ fontSize: 12 }}>{(e.engagement_end || "—").toString().slice(0, 10)}</td>
            <td style={{ whiteSpace: "nowrap" }}>
              <button className="btn sec sm" disabled={busy === e.person_id}
                      title="Put this profile back in front of this vendor"
                      onClick={() => reopen(e)}>
                {busy === e.person_id ? "Working…" : "Make available"}
              </button>
            </td>
          </tr>)}</tbody>
      </table></div>)}
  </Drawer>;
}

/* Which list rows open a drill-down, and which drawer they open. */
// Keys must match ENTITIES exactly — a typo here fails silently, leaving the
// cell as plain text with no hint that a drill-down was ever intended.
const DRILL = { people: PersonDrawer, ptypes: RoleDrawer, tech: TechDrawer, vendors: VendorDrawer };
Object.keys(DRILL).forEach(key => {
  if (!ENTITIES[key]) console.warn(`DRILL key "${key}" matches no entity`);
});

function Knowledge({ section, onSection }) {
  // Which pool is showing comes from the URL, so #/knowledge/projects opens on
  // projects rather than always landing on People. An unknown or missing key
  // falls back rather than rendering nothing.
  const k = ENTITIES[section] ? section : "people";
  const [q, setQ] = useState("");
  const [edit, setEdit] = useState(null);   // {row} | {} for new
  const [drill, setDrill] = useState(null); // {kind, row}
  const [upload, setUpload] = useState(false);
  const [converting, setConverting] = useState(null);
  const ent = ENTITIES[k];

  // A search term belongs to the pool it was typed into. Switching pools —
  // by button or by back button — starts clean.
  useEffect(() => { setQ(""); }, [k]);

  // Re-run the conversion that makes an uploaded design fillable. It fails at
  // upload when the model provider is degraded, and the fix then is to ask
  // again rather than to upload the file a second time.
  const convert = async (row) => {
    setConverting(row.id); setE(null);
    try {
      await api(`/resume-templates/${row.id}/retemplatize`, { method: "POST" });
      reload();
    } catch (x) { setE(x.message); } finally { setConverting(null); }
  };

  // Paged, because the pools outgrew a single request: the technology master
  // alone holds several hundred rows. Numbered pages rather than "load more" —
  // a page number is a place you can come back to, an accumulator only grows.
  //
  // Fetching one page and saying nothing made the list look like the whole
  // pool, which is worse than showing less: you cannot tell what is missing.
  // Hence the count beside the heading.
  const PAGE = 50;
  const [page, setPage] = useState(1);
  const [rows, setRows] = useState([]);
  const [total, setTotal] = useState(0);
  const [l, setL] = useState(true);
  const [e, setE] = useState(null);

  // A new search, or switching pools, starts back at page 1 — otherwise a
  // filter typed while on page 4 of the old list would silently ask for
  // page 4 of the new one.
  useEffect(() => { setPage(1); }, [ent.path, q]);

  const fetchPage = useCallback(async (p) => {
    setL(true);
    try {
      const r = await api(ent.path, {
        params: { limit: PAGE, skip: (p - 1) * PAGE, ...(q ? { search: q } : {}) },
      });
      setTotal(r?.meta?.total ?? 0);
      setRows(list(r));
      setE(null);
    } catch (x) { setE(x.message); } finally { setL(false); }
  }, [ent.path, q]);

  useEffect(() => { fetchPage(page); }, [fetchPage, page]);
  const reload = () => fetchPage(page);
  const pageCount = Math.max(1, Math.ceil(total / PAGE));

  const cell = (r, f) => {
    const v = r[f];
    if (Array.isArray(v)) return v.join(", ") || "—";
    if (typeof v === "boolean") return v ? "Yes" : "No";
    return (v ?? "") === "" ? "—" : String(v);
  };

  return <>
    <div className="card">
      <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
        <h3 style={{ margin: 0 }}>Knowledge base — the reusable pools</h3>
        <span className="subtle" style={{ fontSize: 12 }}>
          {l ? "…" : total
            ? `showing ${(page - 1) * PAGE + 1}–${(page - 1) * PAGE + rows.length} of ${total}`
            : "showing 0 of 0"}
        </span>
      </div>
      <div className="row" style={{ alignItems: "center" }}>
        {Object.entries(ENTITIES).map(([id, v]) =>
          <button key={id} className={"btn " + (k === id ? "" : "sec") + " sm"}
            onClick={() => onSection(id)}>{v.label}</button>)}
        <input style={{ maxWidth: 200, marginLeft: "auto" }} placeholder="Search…"
          value={q} onChange={e => setQ(e.target.value)} />
        {ent.custom === "templates"
          ? <button className="btn sm" onClick={() => setUpload(true)}>Upload template</button>
          : ent.custom === "jd"
            ? <span className="subtle">Raise a JD from the Workspace tab</span>
            : <>
                <button className="btn sm" onClick={() => setEdit({})}>New {ent.label.replace(/s$/, "")}</button>
              </>}
      </div>
      <div className="subtle" style={{ marginTop: 8 }}>
        </div>
    </div>

    <Err e={e} />
    <div className="scroll">
      <table>
        <thead><tr>
          {ent.cols.map(c => <th key={c}>{c.replace(/_/g, " ")}</th>)}
          <th></th>
        </tr></thead>
        <tbody>
          {l && <tr><td colSpan={ent.cols.length + 1} className="empty">Loading…</td></tr>}
          {!l && rows.map(r =>
            <tr key={r.id}>
              {ent.cols.map(c => <td key={c} style={{ maxWidth: 260 }}>
                {c === "source_format" ? <Chip v={r[c]} />
                 /* Fillable means the design has been turned into a template
                    the platform can fill in directly — every resume in it is
                    then a render rather than a rewrite. */
                 : c === "is_fillable"
                 ? <Chip v={r[c] ? "ok" : "warn"} label={r[c] ? "ready" : "not converted"} />
                 : c === "section_titles"
                 ? <span className="subtle" title={(r[c] || []).join(", ")}>
                     {(r[c] || []).length ? `${r[c].length} sections` : "—"}</span>
                 /* The key column is the way in: clicking a person, a role or a
                    technology opens what it connects to. */
                 : c === ent.key && DRILL[k]
                 ? <button className="linky" onClick={() => setDrill({ kind: k, row: r })}>{cell(r, c)}</button>
                 : cell(r, c)}
              </td>)}
              <td style={{ whiteSpace: "nowrap" }}>
                {ent.custom === "jd"
                  ? <button className="btn sec sm" onClick={()=>setEdit({row:r})}>Edit JD</button>
                  : ent.custom === "templates"
                  ? <>
                      {/* Compiles the template's own worked example, so the
                          design can be judged without waiting on a generation. */}
                      <button className="btn sec sm" style={{ marginRight: 4 }}
                        onClick={() => openPdf(`/resume-templates/${r.id}/preview`)}>
                        Preview
                      </button>
                      {!r.is_fillable && r.source_format !== "LAYOUT" &&
                        <button className="btn sec sm" style={{ marginRight: 4 }}
                          title="Re-run the conversion that makes this design fillable"
                          onClick={() => convert(r)}>
                          {converting === r.id ? "Converting…" : "Convert"}
                        </button>}
                      {r.source_storage_path &&
                        <button className="btn sec sm"
                          onClick={() => download2(`/resume-templates/${r.id}/source`, r.source_file_name)}>
                          Download
                        </button>}
                    </>
                  : <>
                      {/* The drill-down answers the question the row raises, so
                          it gets a button of its own rather than staying hidden
                          on the name. */}
                      {DRILL[k] &&
                        <button className="btn sec sm" style={{ marginRight: 4 }}
                                onClick={() => setDrill({ kind: k, row: r })}>Details</button>}
                      {!ent.noEdit &&
                        <button className="btn sec sm" onClick={() => setEdit({ row: r })}>Edit</button>}
                    </>}
              </td>
            </tr>)}
          {!l && !rows.length &&
            <tr><td colSpan={ent.cols.length + 1} className="empty">Nothing here yet.</td></tr>}
        </tbody>
      </table>
    </div>

    <Pager page={page} pageCount={pageCount} onPage={setPage} />

    {edit && (ent.custom === "jd"
      ? <JdEditor row={edit.row}
          onDone={() => { setEdit(null); reload(); }} onCancel={() => setEdit(null)} />
      : <EntityForm ent={ent} row={edit.row}
          onDone={() => { setEdit(null); reload(); }} onCancel={() => setEdit(null)} />)}
    {drill && (() => {
      const D = DRILL[drill.kind];
      return D ? <D person={drill.row} row={drill.row} onClose={() => setDrill(null)} /> : null;
    })()}
    {upload && <TemplateUpload
      onDone={() => { setUpload(false); reload(); }} onCancel={() => setUpload(false)} />}
  </>;
}

/* Open an authenticated PDF endpoint in a new tab.
   The endpoint needs a bearer token, so the file cannot simply be linked —
   it is fetched, turned into a blob URL and handed to the viewer. */
async function openPdf(path) {
  const r = await fetch("/api/v1" + path, { headers: { Authorization: `Bearer ${TOKEN}` } });
  if (!r.ok) {
    let d; try { d = (await r.json())?.error?.message; } catch { d = null; }
    alert(d || `Preview failed: ${r.status}`);
    return;
  }
  const url = URL.createObjectURL(await r.blob());
  window.open(url, "_blank");
  // Revoked late: the new tab has to finish reading it first.
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* download any authenticated endpoint that returns a file */
async function download2(path, name) {
  const r = await fetch("/api/v1" + path, { headers: { Authorization: `Bearer ${TOKEN}` } });
  if (!r.ok) { alert("Download failed: " + r.status); return; }
  const b = await r.blob(), u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name || "template"; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(u);
}

/* ═════════════════════ 4. HISTORY (§27, §28, §33) ═════════════════════ */
/* Composition history: every resume this platform has been asked to build.
   What went OUT to a vendor, and where each person stands with them, is the
   Vendor tracking module — that view is per-vendor, and mixing the two here
   meant reading a flat list to answer a question about one agency.

   Every column filters, and every filter is a dropdown of the values that
   actually occur. Two reasons it is not a set of text boxes: you cannot filter
   to something you have to guess the spelling of, and a free-text box gives no
   hint that a column has only four distinct values in it. The options come from
   /filter-options, which reads the sessions themselves — so every choice offered
   matches at least one row, and a vendor nobody has composed for never appears.

   The filters are applied by the SERVER. Filtering the fetched page in the
   browser would look identical right up until the history outgrows one page,
   and would then quietly start hiding matches — the worst kind of bug, because
   the screen still looks like it is working. Going through the API also means
   the count in the header is the number of matches rather than the number of
   rows that happened to arrive. */

const HISTORY_PAGE = 50;

function History({onOpen}) {
  // One object, so "clear all" is a single assignment and the debounce below
  // has one thing to watch.
  const NO_FILTERS = {
    reference_code: "", person: "", profile: "", vendor: "",
    template: "", status: "", version_no: "", jd: "",
  };
  const [f, setF] = useState(NO_FILTERS);
  const [page, setPage] = useState(1);
  const [openErr, setOpenErr] = useState(null);
  const [delBusy, setDelBusy] = useState("");
  const opts = useAsync(() => api("/resume-sessions/filter-options"), []);

  // Only a draft nobody has approved yet — deleting anything past that would
  // strand a submission or vendor-tracking history behind it, so the server
  // refuses; this mirrors that by only offering the button in that state.
  const deleteSession = async s => {
    if (!confirm(`Delete draft ${s.reference_code || ""} for ${s.person_name}? This cannot be undone.`)) return;
    setDelBusy(s.id); setOpenErr(null);
    try { await api(`/resume-sessions/${s.id}`, {method:"DELETE"}); ses.reload(); }
    catch (x) { setOpenErr(x.message); } finally { setDelBusy(""); }
  };

  // Dropdowns commit on change rather than per keystroke, so a debounce is not
  // strictly needed — it is kept short so that clearing several filters in a
  // row is one request rather than four.
  const [q, setQ] = useState(NO_FILTERS);
  useEffect(() => {
    const t = setTimeout(() => setQ(f), 120);
    return () => clearTimeout(t);
  }, [f]);
  // A new filter starts back at page 1 — otherwise narrowing the table while
  // on page 3 would silently ask the server for page 3 of the new result set.
  useEffect(() => { setPage(1); }, [q]);

  const ses = useAsync(() => {
    const params = { limit: HISTORY_PAGE, skip: (page - 1) * HISTORY_PAGE };
    for (const [k, v] of Object.entries(q)) if (String(v).trim()) params[k] = v;
    return api("/resume-sessions", { params });
  }, [q, page]);

  const rows = list(ses.d);
  const total = ses.d?.meta?.total ?? rows.length;
  const pageCount = Math.max(1, Math.ceil(total / HISTORY_PAGE));
  const active = Object.entries(q).filter(([, v]) => String(v).trim());
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));

  /* One control shape for every column: a select whose blank option reads
     "All", so an unset filter looks unset rather than looking like a value. */
  const pick = (k, label, values) =>
    <select value={f[k]} onChange={e => set(k, e.target.value)}
            title={label}
            style={{
              padding: "5px 6px", fontSize: 12, fontWeight: 400,
              // A set filter is tinted, so you can see at a glance which
              // columns are narrowing the table without reading every box.
              background: f[k] ? "var(--accent-soft)" : "#fff",
              borderColor: f[k] ? "var(--accent)" : "var(--line2)",
            }}>
      <option value="">All</option>
      {(values || []).map(v => <option key={v} value={v}>{v}</option>)}
    </select>;

  return <>
    <div className="card">
      <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
        <h3 style={{ margin: 0 }}>Resume composition sessions</h3>
        <span className="subtle" style={{ fontSize: 12 }}>
          {ses.l ? "…"
            : active.length ? `${total} match${total === 1 ? "" : "es"}`
            : `${total} session${total === 1 ? "" : "s"}`}
          {pageCount > 1 && ` · page ${page} of ${pageCount}`}
        </span>
        {!!active.length &&
          <button className="btn sec sm" onClick={() => setF(NO_FILTERS)}>
            Clear {active.length} filter{active.length === 1 ? "" : "s"}
          </button>}
      </div>
      <Err e={ses.e}/>
      <Err e={openErr}/>
      <Err e={opts.e && `Could not load the filter lists: ${opts.e}`}/>
      <div className="scroll" style={{ marginTop: 10 }}>
        <table>
          <thead>
            <tr><th>Ref</th><th>JD</th><th>Person</th><th>Profile</th><th>Vendor</th>
                <th>Template</th><th>Status</th><th>V</th><th></th></tr>
            {/* The controls live in <thead>, so each sits under the heading it
                belongs to and stays put while the body scrolls. */}
            <tr>
              <th>{pick("reference_code", "Reference", opts.d?.reference_codes)}</th>
              <th>{pick("jd", "JD", opts.d?.jds)}</th>
              <th>{pick("person", "Person", opts.d?.people)}</th>
              <th>{pick("profile", "Profile", opts.d?.profiles)}</th>
              <th>{pick("vendor", "Vendor", opts.d?.vendors)}</th>
              <th>{pick("template", "Template", opts.d?.templates)}</th>
              <th>{pick("status", "Status", opts.d?.statuses)}</th>
              <th>{pick("version_no", "Version", (opts.d?.versions || []).map(v => String(v)))}</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {ses.l && <tr><td colSpan="9" className="empty">Loading…</td></tr>}
            {!ses.l && rows.map(s=>
              <tr key={s.id}>
                <td className="mono">{s.reference_code}</td>
                {/* One JD/vendor pair can have several sessions against it —
                    one per candidate, or several drafts over time — and this
                    is what ties them back together: click it to see every
                    resume raised under this same JD. */}
                <td className="mono">
                  {s.requirement_code
                    ? <button className="linky" onClick={() => { location.hash = hashFor("jd", s.requirement_id); }}>
                        {s.requirement_code}
                      </button>
                    : <span className="subtle">—</span>}
                </td>
                <td><b>{s.person_name}</b></td><td>{s.profile_title}</td>
                <td>{s.vendor_name}</td><td className="subtle">{s.template_name}</td>
                <td><Chip v={s.status}/></td><td>v{s.current_version_no}</td>
                {/* Still in play — being composed, or approved and waiting on
                    an answer — so there is something to open. A RESERVED one
                    goes back to EDITING on the way in. A session somebody has
                    already decided on is a record, not work. */}
                {/* display:flex belongs on the inner div, not the <td> itself --
                    a flex <td> shrink-wraps to its own content instead of
                    joining the table's normal column-width negotiation, so
                    the one row with no buttons (just the "—" placeholder)
                    rendered its column a different width than every other
                    row and looked like a stray floating box. */}
                <td>
                  <div style={{display:"flex", gap:6}}>
                    {OPENABLE.includes(s.status)
                      ? <button className="btn sec sm"
                                onClick={()=>openForEditing(s.id, s.status, onOpen)
                                  .catch(x=>setOpenErr(x.message))}>
                          Open
                        </button>
                      : <span className="subtle">—</span>}
                    {/* Only a draft nobody has approved yet can be deleted outright —
                        anything further along has vendor-tracking history behind it. */}
                    {s.status === "EDITING" &&
                      <button className="btn sec sm" disabled={delBusy===s.id}
                              title="Delete this draft session"
                              onClick={()=>deleteSession(s)}>
                        Delete
                      </button>}
                  </div>
                </td>
              </tr>)}
            {!ses.l && !rows.length &&
              <tr><td colSpan="9" className="empty">
                {active.length ? "No session matches these filters." : "No sessions yet."}
              </td></tr>}
          </tbody>
        </table>
      </div>
      <Pager page={page} pageCount={pageCount} onPage={setPage} />
      <div className="subtle" style={{ marginTop: 8 }}>
        A session sits in <b>EDITING</b> until its resume is approved, which moves it to
        {" "}<b>RESERVED</b>. From Vendor tracking you then say what happened — <b>submitted</b>,
        {" "}<b>engaged</b> or <b>rejected</b> — and that word appears here too; <b>released</b> can
        {" "}only follow an engagement. A reserved hold nobody acts on lapses, and the session simply
        {" "}returns to editing. A session still in <b>EDITING</b> can be deleted outright — nothing has
        {" "}been approved or submitted yet — anything further along must be released instead, not erased.
      </div>
    </div>
  </>;
}

/* ═══════════════════ §29 VENDOR TRACKING ═══════════════════════════

   Everywhere else you start from a JD and look for a person. Here you start
   from a vendor and ask who is currently ours to talk about — which is a
   different question with a different answer, because four of the seven states
   have no submission behind them at all.

   The lifecycle this screen exists to make visible:

     AVAILABLE ─select─▶ EDITING ─approve─▶ RESERVED ─┬─▶ SUBMITTED ─┬─▶ ENGAGED ─▶ RELEASED
                          ▲                           ├─▶ ENGAGED ───┘             (dead end)
                          │                           └─▶ REJECTED (dead end here, but
                          └───── edit it again ──────────(clock)─▶ AVAILABLE  selectable again)

   Only SUBMITTED, ENGAGED, RELEASED and REJECTED are typed by a human, and only
   from the state that makes them true — RESERVED may become SUBMITTED, ENGAGED
   or REJECTED; SUBMITTED may become ENGAGED or REJECTED; ENGAGED may become
   RELEASED. EDITING and RESERVED follow from composing and approving a resume,
   and AVAILABLE follows only from a hold's clock running out, so the picker
   below offers none of those three, and never offers a status the current one
   cannot legally become (MANUAL_TRANSITIONS on the server enforces the same
   dependency, so a stale client cannot skip a step).

   RELEASED is the one true dead end: unlike REJECTED, a released profile never
   becomes selectable for this vendor again — released means an engagement that
   ended, not an opening.

   One vocabulary: whatever is set here is the word the composition session and
   its submission carry too, so History and this view cannot describe the same
   person differently.

   ── Built for fifty vendors, not for three ──────────────────────────────

   A sidebar you scroll to find things is fine at three vendors and useless at
   fifty. Three deliberate choices keep this screen flat as the list grows:

   1. THE DEFAULT VIEW IS "ALL VENDORS". The question somebody actually opens
      this screen with is "what needs attention?", and that answer spans
      vendors. It is the pinned first entry in the rail, and it makes vendor a
      COLUMN rather than a navigation step you have to guess your way through.
   2. THE STATE BAR IS THE FILTER. The counts across the top are buttons: click
      "3 expiring" and the table is those three, whichever vendors they belong
      to. Nobody has to remember which vendor had the problem.
   3. THE RAIL IS SEARCHED, NOT SCROLLED. A filter box, attention-first order,
      and a fixed-height scroll of its own, so the rail never grows the page and
      the busiest vendors are always the ones you can see without scrolling.

   Picking one vendor still works exactly as before — it is now a narrowing of
   a view that was already useful, rather than the only way in. */

/* What a human may assert about a pair, and — critically — from which current
   status each is reachable. Mirrors MANUAL_TRANSITIONS in
   app/utils/enums/profile_status.py: the server is the real authority (it
   refuses anything not listed here even if this map drifts), but the picker
   only offering valid next steps is what makes the dependency visible instead
   of discoverable by trial and error. AVAILABLE, EDITING and RESERVED are
   absent as *targets* on purpose — they follow from composing/approving a
   resume or from a hold's clock running out, never from a human typing them
   in — and ENGAGED, RELEASED, REJECTED have no entry as a *source* because
   none of them has a further manual step. */
const MANUAL_NEXT_STATUSES = {
  /* One step at a time. ENGAGED and REJECTED are answers to a resume that
     went out, so neither is offered until it has: a reserved hold can only
     be submitted. Offering all three at once invited "engaged" on a pair the
     platform's own record said had never been sent anywhere. */
  RESERVED:  ["SUBMITTED"],
  SUBMITTED: ["ENGAGED", "REJECTED"],
  ENGAGED:   ["RELEASED"],
};
const nextStatuses = status => MANUAL_NEXT_STATUSES[status] || [];

/* There is no separate submissions table here any more. A submission used to
   climb a ladder of its own — under review, interview, selected — which meant
   the same person could read RESERVED in one table and ENGAGED in the next.
   One vocabulary now: setting a status on the row above moves the session and
   the submission with it, so there is nothing left for a second table to say. */

/* The state bar, in the order the work flows. "Open" is the pair that wants a
   human — a composition nobody finished, a hold nobody answered. */
const STATE_FILTERS = [
  { key: "open",      label: "Needs attention", of: r => r.status === "EDITING" || r.status === "RESERVED" },
  { key: "EDITING",   label: "Editing",         of: r => r.status === "EDITING" },
  { key: "RESERVED",  label: "Reserved",        of: r => r.status === "RESERVED" },
  { key: "SUBMITTED", label: "Submitted",       of: r => r.status === "SUBMITTED" },
  { key: "ENGAGED",   label: "Engaged",         of: r => r.status === "ENGAGED" },
  { key: "closed",    label: "Closed",          of: r => r.status === "REJECTED" || r.status === "RELEASED" },
];

/* How much of a hold is left, said the way somebody would say it out loud. The
   server sends minutes so the browser never does timezone arithmetic. */
function holdLeft(minutes) {
  if (minutes === null || minutes === undefined) return null;
  if (minutes <= 0) return "lapsing";
  if (minutes < 60) return `${minutes}m left`;
  if (minutes < 60 * 48) return `${Math.round(minutes / 60)}h left`;
  return `${Math.round(minutes / 60 / 24)}d left`;
}

/* A hold inside a day is the one thing on this screen with a deadline, so it
   is the one thing that gets to look urgent. */
const holdIsUrgent = m => m !== null && m !== undefined && m <= 60 * 24;

function VendorTracking({ vendor, onVendor, onOpenStudio }) {
  const vendors = useAsync(() => api("/vendor-tracking"), []);
  // Which vendor is selected comes from the URL, so one vendor's board is a
  // link somebody can send. null means "all vendors" — the default, and the
  // view that does not get worse as vendors are added.
  const pick = vendor || null;
  const setPick = onVendor;
  const [state, setState]   = useState(null);   // one of STATE_FILTERS.key
  const [rq, setRq]         = useState("");     // table filter
  const [page, setPage]     = useState(1);
  const TABLE_PAGE = 20;

  // The person/role filter belongs to the board you typed it into.
  useEffect(() => { setRq(""); }, [pick]);
  // Switching vendor, state or filter starts back at page 1.
  useEffect(() => { setPage(1); }, [pick, state, rq]);
  const [busy, setBusy]     = useState("");
  const [err, setErr]       = useState(null);

  const rows = useAsync(
    () => api(pick ? `/vendor-tracking/${pick}/profiles` : "/vendor-tracking/profiles"),
    [pick],
  );

  const advance = async (row, status) => {
    setBusy(row.person_id + row.vendor_id); setErr(null);
    try {
      // Scoped by the row's own vendor, so this works identically in the
      // all-vendors view where the table spans many of them.
      await api(`/vendor-tracking/${row.vendor_id}/profiles/${row.person_id}/status`,
                { method: "POST", body: { status } });
      rows.reload(); vendors.reload();
    } catch (x) { setErr(x.message); } finally { setBusy(""); }
  };

  const [delBusy, setDelBusy] = useState("");
  // Only a draft nobody has approved yet — see resume_session_service.delete_session.
  const deleteSession = async row => {
    if (!confirm(`Delete this draft session for ${row.person_name}? This cannot be undone.`)) return;
    setDelBusy(row.person_id + row.vendor_id); setErr(null);
    try {
      await api(`/resume-sessions/${row.session_id}`, { method: "DELETE" });
      rows.reload(); vendors.reload();
    } catch (x) { setErr(x.message); } finally { setDelBusy(""); }
  };

  // For a pair reserved but never turned into a resume session — see
  // vendor_tracking.release_orphan_hold. Without this, a row with no session
  // has no Open, no Delete, and nothing for Set status to advance: nothing
  // to click at all.
  const releaseHold = async row => {
    if (!confirm(`Release the hold on ${row.person_name} for ${row.vendor_name}? `+
                 `Nothing was ever built for it — this returns them to Available.`)) return;
    setBusy(row.person_id + row.vendor_id); setErr(null);
    try {
      await api(`/vendor-tracking/${row.vendor_id}/profiles/${row.person_id}/release-hold`, { method: "POST" });
      rows.reload(); vendors.reload();
    } catch (x) { setErr(x.message); } finally { setBusy(""); }
  };


  const all = rows.d || [];
  const chosen = (vendors.d || []).find(v => v.vendor_id === pick);

  // Counts come off the rows on screen, so the bar and the table can never
  // disagree — including while a reload is in flight.
  const counted = STATE_FILTERS.map(f => ({ ...f, n: all.filter(f.of).length }));
  const active = STATE_FILTERS.find(f => f.key === state);
  const shownAll = all
    .filter(r => !active || active.of(r))
    .filter(r => !rq || `${r.person_name} ${r.role || ""} ${r.vendor_name}`
                          .toLowerCase().includes(rq.toLowerCase()));
  const pageCount = Math.max(1, Math.ceil(shownAll.length / TABLE_PAGE));
  // Clamped rather than reset: a status change or reload can shrink the list
  // out from under the page you were on, without that counting as a new
  // filter (the effect above only fires when pick/state/rq change).
  const curPage = Math.min(page, pageCount);
  const shown = shownAll.slice((curPage - 1) * TABLE_PAGE, curPage * TABLE_PAGE);

  const rail = (vendors.d || [])
    .sort((a, b) => (b.editing + b.reserved) - (a.editing + a.reserved)
                 || b.tracked_profiles - a.tracked_profiles
                 || a.vendor_name.localeCompare(b.vendor_name));

  const railRow = (key, name, sub, open, selected) =>
    <button key={key} onClick={() => setPick(key)}
            style={{
              display: "block", width: "100%", textAlign: "left", marginBottom: 2,
              padding: "6px 9px", borderRadius: 4, border: "1px solid transparent",
              background: selected ? "var(--accent-soft)" : "transparent",
            }}>
      <div style={{ display: "flex", gap: 6, alignItems: "baseline" }}>
        <span style={{ fontSize: 12.5, fontWeight: selected ? 700 : 500,
                       overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{name}</span>
        {!!open && <span className="chip warn" style={{ marginLeft: "auto" }}>{open}</span>}
      </div>
      <div className="subtle" style={{ fontSize: 11 }}>{sub}</div>
    </button>;

  return <div style={{ display: "grid", gridTemplateColumns: "230px 1fr", gap: 14, alignItems: "start" }}>
    <div className="card" style={{ margin: 0, position: "sticky", top: 0 }}>
      <h3>Vendors</h3>
      <select value={pick || ""} onChange={e => setPick(e.target.value || null)}
              style={{ marginBottom: 8, padding: "6px 8px", fontSize: 12.5 }}>
        <option value="">All vendors</option>
        {rail.slice().sort((a, b) => a.vendor_name.localeCompare(b.vendor_name))
          .map(v => <option key={v.vendor_id} value={v.vendor_id}>{v.vendor_name}</option>)}
      </select>
      <Err e={vendors.e} />
      {/* Its own scroll, so fifty vendors never stretch the page and the table
          on the right stays where the eye left it. */}
      <div style={{ maxHeight: "calc(100vh - 230px)", overflowY: "auto", margin: "0 -4px" }}>
        {railRow(null, "All vendors",
                 `${(vendors.d || []).reduce((n, v) => n + v.tracked_profiles, 0)} profiles tracked`,
                 (vendors.d || []).reduce((n, v) => n + v.editing + v.reserved, 0),
                 pick === null)}
        <div style={{ borderTop: "1px solid var(--line)", margin: "6px 4px" }} />
        {vendors.l ? <div className="empty">Loading…</div> :
         !rail.length ? <div className="empty" style={{ fontSize: 12 }}>
             No vendors yet.
           </div> :
         rail.map(v => railRow(
           v.vendor_id, v.vendor_name,
           `${v.tracked_profiles} profile${v.tracked_profiles === 1 ? "" : "s"}`
             + (v.submitted ? ` · ${v.submitted} submitted` : "")
             + (v.engaged ? ` · ${v.engaged} engaged` : ""),
           v.editing + v.reserved, v.vendor_id === pick))}
      </div>
    </div>

    <div className="card" style={{ margin: 0 }}>
      <h3>{chosen ? chosen.vendor_name : "All vendors"} — profiles put forward</h3>
      <Err e={err} />
      <Err e={rows.e} />

      {/* Counts that are also the filter. Clicking "Expired" answers "which
          ones lapsed" without knowing which vendor to look under. */}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "0 0 10px" }}>
        <button className={"btn sm " + (state === null ? "" : "sec")}
                onClick={() => setState(null)}>All {all.length}</button>
        {counted.filter(f => f.n > 0).map(f =>
          <button key={f.key} className={"btn sm " + (state === f.key ? "" : "sec")}
                  onClick={() => setState(state === f.key ? null : f.key)}>
            {f.label} {f.n}
          </button>)}
        <input placeholder="Filter by person or role…" value={rq} onChange={e => setRq(e.target.value)}
               style={{ marginLeft: "auto", maxWidth: 220, padding: "5px 8px", fontSize: 12.5 }} />
      </div>

      {rows.l ? <div className="empty">Loading…</div> :
       !all.length ? <div className="empty">No profile has been put forward yet.</div> :
       !shownAll.length ? <div className="empty">Nothing matches that filter.</div> :
       <div className="scroll">
         {/* Seven columns do not fit a narrow window, and `table{width:100%}`
             makes them squeeze rather than scroll — which is what put "Test
             Vendor" on two lines and stacked the row actions. A min-width lets
             the columns keep their natural size and hands the overflow to
             .scroll, which is already an overflow:auto container. */}
         <table style={{ minWidth: 900 }}>
           <thead><tr>
             <th>Person</th>
             {/* The vendor is a column when the view spans them, and redundant
                 chrome when it does not. */}
             {!pick && <th>Vendor</th>}
             <th style={{ minWidth: 200 }}>Selected for</th><th>Resume</th>
             <th>Status</th><th>Hold</th><th>Set status</th>
           </tr></thead>
           <tbody>{shown.map(r =>
             <tr key={r.vendor_id + r.person_id}>
               {/* Names do not wrap: "Abhishek Kumar" broken across two lines
                   reads as two people at a glance, and the row height it costs
                   is paid by every other row in the table. */}
               <td style={{ whiteSpace: "nowrap" }}><b>{r.person_name}</b>
                 {r.engagement_label &&
                   <div className="subtle" style={{ fontSize: 11.5 }}>{r.engagement_label}</div>}
               </td>
               {!pick && <td style={{ whiteSpace: "nowrap" }}>
                 <button className="linky" onClick={() => setPick(r.vendor_id)}>{r.vendor_name}</button>
               </td>}
               <td>{r.role || <span className="subtle">—</span>}
                 {r.requirement_code &&
                   <div className="mono" style={{ fontSize: 11.5 }}>
                     {/* Same JD/vendor pair can have several sessions against it — this is
                         what ties them back together across History and this table. */}
                     <button className="linky" style={{ fontSize: 11.5 }}
                             onClick={() => { location.hash = hashFor("jd", r.requirement_id); }}>
                       {r.requirement_code}
                     </button>
                   </div>}
               </td>
               {/* Reference on its own line, actions on a row beneath it. They
                   used to run inline, so as soon as the column narrowed the
                   buttons wrapped one under the other and every row grew a
                   third line. A flex row keeps them side by side at any
                   width. */}
               <td className="mono" style={{ fontSize: 12, whiteSpace: "nowrap" }}>
                 <div>
                   {r.submission_reference || r.session_reference || "—"}
                   {r.version_no ? <span className="subtle"> · v{r.version_no}</span> : null}
                 </div>
                 {r.session_id && (OPENABLE.includes(r.status) || r.status === "EDITING") &&
                   <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
                     {/* A composition still in play is the row you can act on
                         directly, so it gets the way back into the studio. A
                         RESERVED one returns to editing on the way in. */}
                     {OPENABLE.includes(r.status) &&
                       <button className="btn sec sm"
                               disabled={busy === r.person_id + r.vendor_id}
                               onClick={() => openForEditing(r.session_id, r.status, onOpenStudio)
                                 .catch(x => setErr(x.message))}>Open</button>}
                     {/* Only while still EDITING — nothing approved or submitted
                         yet to strand behind it. */}
                     {r.status === "EDITING" &&
                       <button className="btn sec sm"
                               disabled={delBusy === r.person_id + r.vendor_id}
                               title="Delete this draft session"
                               onClick={() => deleteSession(r)}>Delete</button>}
                   </div>}
                 {/* No session at all — reserved, and then never composed.
                     Every other action in this row assumes a session exists;
                     this is the one way back to Available for a hold that
                     has nothing behind it. */}
                 {!r.session_id && (r.status === "EDITING" || r.status === "RESERVED") &&
                   <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
                     <button className="btn sec sm"
                             disabled={busy === r.person_id + r.vendor_id}
                             title="No resume was ever started for this hold"
                             onClick={() => releaseHold(r)}>Release hold</button>
                   </div>}
               </td>
               <td><Chip v={r.status} /></td>
               <td style={{ fontSize: 12 }}
                   className={holdIsUrgent(r.hold_minutes_left) ? "" : "subtle"}>
                 {holdIsUrgent(r.hold_minutes_left)
                   ? <b style={{ color: "var(--warn)" }}>{holdLeft(r.hold_minutes_left)}</b>
                   : (holdLeft(r.hold_minutes_left) || "—")}
               </td>
               <td>
                 {nextStatuses(r.status).length
                   ? <select style={{ width: 140 }} value=""
                             disabled={busy === r.person_id + r.vendor_id}
                             onChange={ev => ev.target.value && advance(r, ev.target.value)}>
                       <option value="">Set status…</option>
                       {nextStatuses(r.status).map(x => <option key={x} value={x}>{x}</option>)}
                     </select>
                   : <span className="subtle" style={{ fontSize: 12 }}>
                       {r.status === "RELEASED" || r.status === "REJECTED" ? "Closed" : "—"}
                     </span>}
               </td>
             </tr>)}</tbody>
         </table>
       </div>}
      {!rows.l && !!shownAll.length &&
        <Pager page={curPage} pageCount={pageCount} onPage={setPage} />}

      <div className="subtle" style={{ marginTop: 8 }}>
        Selecting a profile holds it as <b>EDITING</b>; approving its resume moves it to <b>RESERVED</b>.
        {" "}From there the steps run in order, one at a time: a reserved resume can only be marked
        {" "}<b>submitted</b>, and only once it has gone out can the vendor's answer — <b>engaged</b>
        {" "}or <b>rejected</b> — be recorded. Whatever you pick is the status History shows for that
        {" "}session too. Only someone <b>engaged</b> can be <b>released</b>: you can only let go of
        {" "}somebody who was actually taken. Rejected profiles come back to this vendor's pool with no
        {" "}action needed; released ones do not, though a past engagement can be reopened from the
        {" "}vendor's page in the Knowledge base. A reserved hold nobody acts on lapses back to
        {" "}<b>available</b> on its own, and the session returns to editing. <b>Open</b> picks the work back up either way: a
        {" "}reserved resume goes back to editing on a fresh hold, and approving it again returns it to
        {" "}reserved. A session still in <b>EDITING</b> can be <b>deleted</b> outright, releasing the
        {" "}hold; anything further along must be released instead, not erased.
      </div>

    </div>
  </div>;
}

/* ═══════════════════ JD MODULE ═══════════════════════════════════════

   One JD (Requirement) is already scoped to one vendor — that pairing is
   fixed the moment the JD is raised, so "another resume for the same JD"
   already means "the same JD and vendor" without a separate scope to pick.
   This module is where more than one resume against that same JD lives:
   raise as many as the role needs, each for a different candidate, and once
   one of them is approved its projects and companies are spent — the server
   refuses to hand them to a second resume under the same JD (see
   resume_composer.used_projects_and_companies_for_requirement). A second
   resume has to tell a different story, not retell the first one. */

function JDModule({ requirementId, onSelect, onBack, onStudio }) {
  return requirementId
    ? <JDDetail requirementId={requirementId} onBack={onBack} onStudio={onStudio}/>
    : <JDList onSelect={onSelect} onStudio={onStudio}/>;
}

function JDList({ onSelect, onStudio }) {
  // Accumulated across pages rather than one fetch with a raised limit — the
  // list filters by text on reference, vendor and role together, which the
  // server has nowhere to do, so filtering has to happen here on the whole
  // set. A single capped fetch would silently hide JDs past the cap, which
  // is exactly the failure this same pattern was already fixed for once,
  // in the technology pool (see Knowledge).
  const FETCH_PAGE = 200;
  const reqs = useAsync(async () => {
    let skip = 0, items = [], total = Infinity;
    while (items.length < total) {
      const r = await api("/requirements", { params: { limit: FETCH_PAGE, skip } });
      const got = list(r);
      total = r?.meta?.total ?? got.length;
      items = items.concat(got);
      if (!got.length) break;
      skip += FETCH_PAGE;
    }
    return items;
  }, []);
  const [q, setQ] = useState("");
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;
  const [newFor, setNewFor] = useState(null);

  useEffect(() => { setPage(1); }, [q]);

  const filtered = list(reqs.d).filter(r =>
    !q || `${r.reference_code} ${r.vendor_name} ${r.parsed_role||""}`.toLowerCase().includes(q.toLowerCase()));
  const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const curPage = Math.min(page, pageCount);
  const rows = filtered.slice((curPage - 1) * PAGE_SIZE, curPage * PAGE_SIZE);

  return <div className="card">
    <div style={{display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap"}}>
      <h3 style={{margin:0}}>JDs — one requirement, as many resumes as it needs</h3>
      <span className="subtle" style={{fontSize:12}}>
        {reqs.l ? "…" : `${filtered.length} of ${list(reqs.d).length}`}
      </span>
      <input placeholder="Filter by reference, vendor or role…" value={q} onChange={e=>setQ(e.target.value)}
             style={{marginLeft:"auto",maxWidth:240,padding:"5px 8px",fontSize:12.5}}/>
    </div>
    <Err e={reqs.e}/>
    <div className="scroll" style={{marginTop:10}}>
      <table>
        <thead><tr>
          <th>Reference</th><th>Vendor</th><th>Role</th><th>Min years</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>
          {reqs.l && <tr><td colSpan="6" className="empty">Loading…</td></tr>}
          {!reqs.l && rows.map(r =>
            <tr key={r.id}>
              <td className="mono">
                <button className="linky" onClick={()=>onSelect(r.id)}>{r.reference_code}</button>
              </td>
              <td>{r.vendor_name}</td>
              <td>{r.parsed_role || <span className="subtle">—</span>}</td>
              <td>{r.min_experience_years ?? <span className="subtle">—</span>}</td>
              <td><Chip v={r.status}/></td>
              <td>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn sec sm" onClick={()=>onSelect(r.id)}>View resumes</button>
                  <button className="btn sm" title="New resume for this JD" onClick={()=>setNewFor(r)}>+</button>
                </div>
              </td>
            </tr>)}
          {!reqs.l && !rows.length &&
            <tr><td colSpan="6" className="empty">
              {q ? "No JD matches that filter." : "No JDs yet — raise one from the Workspace tab."}
            </td></tr>}
        </tbody>
      </table>
    </div>
    <Pager page={curPage} pageCount={pageCount} onPage={setPage} />
    {newFor && <NewResumeModal requirement={newFor} onCancel={()=>setNewFor(null)}
                                onStudio={id=>{ setNewFor(null); onStudio(id); }}/>}
  </div>;
}

function JDDetail({ requirementId, onBack, onStudio }) {
  const req = useAsync(()=>api(`/requirements/${requirementId}`), [requirementId]);
  const [page, setPage] = useState(1);
  const SESS_PAGE = 20;
  useEffect(() => { setPage(1); }, [requirementId]);
  // A draft still in EDITING is nobody's answer yet — it belongs on the
  // Studio/History screens where work in progress lives, not here, where
  // this JD's actual track record with each candidate is what matters. So
  // this fetches everything for the requirement (accumulated, not one
  // capped page — a JD with real history should not silently lose rows past
  // the server's page cap) and keeps only what was actually approved.
  const FETCH_PAGE = 200;
  const sessions = useAsync(async () => {
    let skip = 0, items = [], total = Infinity;
    while (items.length < total) {
      const r = await api("/resume-sessions", { params: { requirement_id: requirementId, limit: FETCH_PAGE, skip } });
      const got = list(r);
      total = r?.meta?.total ?? got.length;
      items = items.concat(got);
      if (!got.length) break;
      skip += FETCH_PAGE;
    }
    return items.filter(s => s.status !== "EDITING");
  }, [requirementId]);
  const [newOpen, setNewOpen] = useState(false);
  const [openErr, setOpenErr] = useState(null);

  const r = req.d;
  const all = list(sessions.d);
  const pageCount = Math.max(1, Math.ceil(all.length / SESS_PAGE));
  const curPage = Math.min(page, pageCount);
  const rows = all.slice((curPage - 1) * SESS_PAGE, curPage * SESS_PAGE);

  return <div className="card">
    <div style={{display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap"}}>
      <button className="btn sec sm" onClick={onBack}>← All JDs</button>
      <h3 style={{margin:0}}>{r?.reference_code || "…"} — {r?.parsed_role || "resumes"}</h3>
      {r && <Chip v={r.status}/>}
      <button className="btn sm" style={{marginLeft:"auto"}} onClick={()=>setNewOpen(true)}>
        + New resume for this JD
      </button>
    </div>
    <Err e={req.e}/>
    {r && <div className="row" style={{margin:"12px 0"}}>
      <div><label>Vendor</label><b>{r.vendor_name}</b></div>
      <div><label>Min experience</label><b>{r.min_experience_years ?? "—"} yrs</b></div>
      <div><label>Location</label><b>{r.location || "—"}</b></div>
      <div><label>Template</label><b>{r.template_name || "—"}</b></div>
    </div>}

    <Err e={sessions.e}/>
    <Err e={openErr}/>
    <div className="scroll" style={{marginTop:6}}>
      <table>
        <thead><tr><th>Ref</th><th>Person</th><th>Profile</th><th>Status</th><th>V</th><th></th></tr></thead>
        <tbody>
          {sessions.l && <tr><td colSpan="6" className="empty">Loading…</td></tr>}
          {!sessions.l && rows.map(s =>
            <tr key={s.id}>
              <td className="mono">{s.reference_code}</td>
              <td><b>{s.person_name}</b></td>
              <td>{s.profile_title}</td>
              <td><Chip v={s.status}/></td>
              <td>v{s.current_version_no}</td>
              <td>{OPENABLE.includes(s.status)
                ? <button className="btn sec sm"
                          onClick={()=>openForEditing(s.id, s.status, onStudio).catch(x=>setOpenErr(x.message))}>
                    Open
                  </button>
                : <span className="subtle">—</span>}</td>
            </tr>)}
          {!sessions.l && !rows.length &&
            <tr><td colSpan="6" className="empty">
              No resume has been approved for this JD yet — drafts still being edited show in
              {" "}Vendor tracking and History, not here.
            </td></tr>}
        </tbody>
      </table>
    </div>
    <Pager page={curPage} pageCount={pageCount} onPage={setPage} />
    <div className="subtle" style={{marginTop:8}}>
      Only approved resumes are listed here — a draft still in EDITING shows in Vendor tracking
      {" "}and History instead. Once a resume here is approved, the projects and companies it used are spent for this JD —
      a new resume raised against it is offered the rest of the bank, never the same mix again.
    </div>
    {newOpen && r && <NewResumeModal requirement={r} onCancel={()=>setNewOpen(false)}
                                      onStudio={onStudio}/>}
  </div>;
}

/* Add the operator-approved technologies to the knowledge base and re-resolve
   the JD's skills against it, BEFORE generating. Doing it after would compose
   a resume that cannot mention them. */
async function commitMissingTechs(requirementId, techs) {
  const ready = (techs || []).filter(x => x.name && x.release_year);
  if (!ready.length) return;
  await api(`/requirements/${requirementId}/technologies`, {
    method: "POST",
    body: { technologies: ready.map(x => ({ name: x.name, release_year: Number(x.release_year) })) },
  });
}

/* JD skills the technology master has never heard of.
   Shown on the generation form because a technology the bank does not hold
   cannot be selected, cannot print in the skills section, and cannot be
   checked against a period — so it is worth stopping for before composing
   rather than explaining in a warning afterwards. Every one needs a release
   year: that date is what the era checks compare a composed timeline
   against, and one without it opts out of them silently. */
function MissingTechs({ requirementId, value, onChange }) {
  const found = useAsync(
    () => requirementId
      ? api(`/requirements/${requirementId}/missing-technologies`).then(r => r.missing || [])
      : Promise.resolve([]),
    [requirementId]);

  const rows = list(found.d);
  useEffect(() => {
    if (!rows.length) { onChange([]); return; }
    onChange(rows.map(m => ({ name: m.name, release_year: m.suggested_release_year || "" })));
  }, [found.d]);

  if (found.l || !rows.length) return null;

  const setYear = (name, year) =>
    onChange(value.map(v => v.name === name ? { ...v, release_year: year } : v));

  const missingYear = value.some(v => !v.release_year);
  return <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--line)" }}>
    <label style={{ fontWeight: 600 }}>
      Not in the knowledge base{" "}
      <span className="chip warn">{rows.length}</span>
    </label>
    <div className="subtle" style={{ marginBottom: 8 }}>
      This JD asks for {rows.length === 1 ? "a technology" : "technologies"} the knowledge base
      does not hold. Give {rows.length === 1 ? "it" : "each"} a release year and{" "}
      {rows.length === 1 ? "it" : "they"} will be added, linked to this JD, and used in the
      resume's skills and descriptions. The release year is what dates the work: it stops a
      technology being claimed years before it existed.
    </div>
    {value.map(v => {
      const meta = rows.find(r => r.name === v.name) || {};
      return <div key={v.name}
                  style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 5 }}>
        <span style={{ minWidth: 190, fontWeight: 500 }}>{v.name}</span>
        <Chip v={meta.importance || "MANDATORY"} />
        <input type="number" min="1960" max="2100" placeholder="Release year"
               value={v.release_year} onChange={e => setYear(v.name, e.target.value)}
               style={{ width: 120 }} />
        {!v.release_year && <span className="subtle" style={{ fontSize: 11.5 }}>needed</span>}
      </div>;
    })}
    {missingYear &&
      <div className="subtle" style={{ color: "var(--warn)", marginTop: 4 }}>
        Every technology needs a release year before the resume can be generated.
      </div>}
  </div>;
}

/* The two questions asked before the first generation. Answering them up
   front is cheaper than a rebuild: the counts drive what is fetched from the
   knowledge base, how it is split between employers, and how the timeline is
   laid out — so getting them right the first time is the difference between
   a usable version 1 and ten minutes in the Composition tab. */
function ShapeForm({ value, onChange }) {
  const set = (k, v) => onChange({ ...value, [k]: v === "" ? null : Number(v) });
  const num = (k, label, min, max, hint) =>
    <div style={{ maxWidth: 190 }}>
      <label>{label}</label>
      <input type="number" min={min} max={max} value={value[k] ?? ""}
             onChange={e => set(k, e.target.value)} />
      <div className="subtle" style={{ fontSize: 11, marginTop: 2 }}>{hint}</div>
    </div>;

  const projects = value.project_count || 0;
  const companies = value.company_count || 0;
  return <>
    <div className="row" style={{ alignItems: "flex-start" }}>
      {num("company_count", "Companies", 1, 8, "Employers in the experience section")}
      {num("project_count", "Projects (total)", 1, 12, "Split across them by the composer")}
      {num("target_pages", "Pages", 1, 3, "Two suits 5+ years of experience")}
    </div>
    <div className="subtle" style={{ marginTop: 6 }}>
      {projects && companies
        ? `The top ${projects} project${projects === 1 ? "" : "s"} for this JD are pulled from the knowledge base and divided across ${companies} employer${companies === 1 ? "" : "s"} — not necessarily evenly, since 3/2/1 is often the better story. Project names are kept as recorded and only the descriptions are angled at this JD. The timeline is laid out to meet the JD's stated experience, with the earliest roles titled for their era.`
        : "Leave blank to use the house defaults."}
    </div>
  </>;
}

/* Person picker for one JD — the same step as Workspace step 3, reusable
   here because a JD already carries its own vendor and template. */
function NewResumeModal({ requirement, onCancel, onStudio }) {
  const rows = useAsync(()=>api(`/availability/requirements/${requirement.id}/profiles`).then(list), [requirement.id]);
  const [pick, setPick] = useState(null);
  const [busy, setBusy] = useState(false);
  const [e, setE] = useState(null);
  const [shape, setShape] = useState({company_count:4, project_count:6, target_pages:2});
  const [newTechs, setNewTechs] = useState([]);

  // Several resumes come off one JD — a different candidate, or a second
  // attempt for the same one — and each is allowed its own design. Starts on
  // the JD's template and is overridden here, for this resume only.
  const templates = useAsync(()=>api("/resume-templates").then(list), []);
  const [tpl, setTpl] = useState("");
  useEffect(()=>{
    if (!templates.d?.length || tpl) return;
    const carried = templates.d.find(t => t.id === requirement.template_id);
    setTpl((carried || templates.d[0]).id);
  }, [templates.d, requirement.template_id]);

  const [genSessionId, setGenSessionId] = useState(null);
  const genProgress = useGenerationProgress(genSessionId, busy);
  const start = async () => {
