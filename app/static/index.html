</style>
</head>
<body><div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* ────────────────────────────── api ────────────────────────────── */
let TOKEN = localStorage.getItem("jdrp_token") || "";
const setToken = t => { TOKEN = t; t ? localStorage.setItem("jdrp_token",t) : localStorage.removeItem("jdrp_token"); };

async function api(path, {method="GET", body, raw=false, params} = {}) {
  let url = "/api/v1" + path;
  if (params) {
    const q = new URLSearchParams();
    Object.entries(params).forEach(([k,v]) => {
      if (v == null || v === "") return;
      Array.isArray(v) ? v.forEach(x => q.append(k,x)) : q.append(k,v);
    });
    if ([...q].length) url += "?" + q;
  }
  const r = await fetch(url, {
    method,
    headers: { "Content-Type":"application/json", ...(TOKEN && {Authorization:`Bearer ${TOKEN}`}) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 401) { setToken(""); location.reload(); }
  if (!r.ok) {
    let d; try { d = await r.json(); } catch { d = await r.text(); }
    const msg = d?.error?.message
      ? d.error.message
      : d?.detail
      ? (Array.isArray(d.detail) ? d.detail.map(e=>`${e.loc?.slice(1).join(".")}: ${e.msg}`).join("\n") : d.detail)
      : (typeof d === "string" ? d : JSON.stringify(d));
    throw new Error(`${r.status} — ${msg}`);
  }
  if (raw) return r.text();
  return r.status === 204 ? null : r.json();
}
const list = d => Array.isArray(d) ? d : (d?.items ?? []);

async function download(fileId, name) {
  const r = await fetch(`/api/v1/files/${fileId}/download`, {headers:{Authorization:`Bearer ${TOKEN}`}});
  if (!r.ok) throw new Error("Download failed: " + r.status);
  const b = await r.blob(), u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name || "resume"; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(u);
}

/* §31 — open a session in the studio, taking it back into editing first when it
   is an approved resume sitting on a hold.

   A RESERVED hold is an answer nobody has given yet, not finished work, so the
   composition stays ours to change until somebody decides. Reopening returns
   the session to EDITING on a fresh clock; approving it again puts it back on
   a hold, and that loop runs as often as the work needs.

   Every list with an Open button goes through here, so none of them can drift
   into opening a resume the studio would then refuse to edit. A session that
   has been decided on — submitted, engaged, released, rejected — is not
   openable at all, and those lists do not offer the button. */
const OPENABLE = ["EDITING", "RESERVED"];
async function openForEditing(sessionId, status, onOpenStudio) {
  if (status === "RESERVED") {
    await api(`/resume-sessions/${sessionId}/reopen`, { method: "POST", body: {} });
  }
  onOpenStudio(sessionId);
}

/* ─────────────────────────── primitives ─────────────────────────── */
const Chip = ({v, label}) => v ? <span className={"chip " + v}>{String(label ?? v).replace(/_/g," ")}</span> : null;
const Err  = ({e}) => e ? <div className="err">{String(e)}</div> : null;

function Btn({busy, children, ...p}) {
  return <button {...p} disabled={p.disabled||busy} className={p.className||"btn"}>
    {busy ? <span className="spin"/> : children}
  </button>;
}

/* Numbered paging (1, 2, 3 …), one shape reused by every list in the app.
   Distant pages collapse to "…" so the row never overflows once a pool
   grows past a handful of pages — only the ends and a window around the
   current page are ever shown as buttons. Renders nothing at one page,
   since a control for a list that cannot page is chrome with no function. */
function Pager({ page, pageCount, onPage }) {
  if (pageCount <= 1) return null;
  const win = 1;
  const nums = [];
  for (let i = 1; i <= pageCount; i++) {
    if (i === 1 || i === pageCount || Math.abs(i - page) <= win) nums.push(i);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  }
  return <div style={{ display: "flex", gap: 4, alignItems: "center",
                        justifyContent: "center", margin: "12px 0", flexWrap: "wrap" }}>
    <button className="btn sec sm" disabled={page <= 1} onClick={() => onPage(page - 1)}>‹ Prev</button>
    {nums.map((n, i) => n === "…"
      ? <span key={"gap" + i} className="subtle" style={{ padding: "0 2px" }}>…</span>
      : <button key={n} className={"btn sm " + (n === page ? "" : "sec")}
                style={n === page ? { fontWeight: 700 } : undefined}
                onClick={() => onPage(n)}>{n}</button>)}
    <button className="btn sec sm" disabled={page >= pageCount} onClick={() => onPage(page + 1)}>Next ›</button>
  </div>;
}

function useAsync(fn, deps) {
  const [d,setD] = useState(null), [e,setE] = useState(null), [l,setL] = useState(true);
  const run = useCallback(() => {
    setL(true); setE(null);
    fn().then(setD).catch(x=>setE(x.message)).finally(()=>setL(false));
  }, deps);
  useEffect(() => { run(); }, [run]);
  return {d,e,l,reload:run,set:setD};
}

/* Polls /generation-progress while a generation is in flight, so a spinner
   with no other signal is not mistaken for a hang -- the actual question that
   came up during testing. `active` gates the polling; the hook owns nothing
   else and is safe to mount unconditionally. */
function useGenerationProgress(sessionId, active) {
  const [state, setState] = useState(null);
  useEffect(() => {
    if (!active || !sessionId) { setState(null); return; }
    let stopped = false;
    const tick = () => {
      api(`/resume-sessions/${sessionId}/generation-progress`).then(d => {
        if (!stopped) setState(d);
      }).catch(() => {});
    };
    tick();
    const id = setInterval(tick, 900);
    return () => { stopped = true; clearInterval(id); };
  }, [sessionId, active]);
  return state;
}

/* The checklist itself -- short, precise, real: each line is a stage the
   pipeline actually just reached, not a simulated timer. */
function GenerationChecklist({ progress }) {
  if (!progress || !progress.active) return null;
  const { steps, index, elapsed_seconds } = progress;
  return <div className="genprogress">
    {steps.map((label, i) =>
      <div key={label} className={"gp-row " + (i < index ? "done" : i === index ? "on" : "")}>
        <span className="gp-dot">{i < index ? "✓" : ""}</span>
        <span>{label}</span>
      </div>)}
    <div className="subtle" style={{ marginTop: 4, fontSize: 11 }}>
      {Math.round(elapsed_seconds || 0)}s elapsed — a large reply from the model can take a few minutes
    </div>
  </div>;
}

/* ─────────────────────────────  login  ─────────────────────────── */
function Login({onIn}) {
  const [mode,setMode]   = useState("in");   // "in" | "up"
  const [email,setEmail] = useState("admin@example.com");
  const [pw,setPw]       = useState("admin123");
  const [name,setName]   = useState("");
  const [e,setE]         = useState(null), [b,setB] = useState(false);
  const up = mode === "up";

  const go = async ev => {
    ev.preventDefault(); setB(true); setE(null);
    try {
      const r = up
        ? await api("/auth/signup",{method:"POST",body:{email,password:pw,full_name:name||null}})
        : await api("/auth/login",{method:"POST",body:{email,password:pw}});
      setToken(r.access_token); onIn();
    } catch(x){ setE(x.message); } finally { setB(false); }
  };

  const toggle = () => {
    setE(null); setMode(m => m==="in" ? "up" : "in");
    if (!up) { setEmail(""); setPw(""); setName(""); }
  };

  return <div className="login-page">
    <div className="login-card">
      {/* Inline SVG rather than an image file: nothing to ship, nothing to
          keep in sync with the palette, and it is sharp at any size. */}
      <div className="login-art">
        <svg viewBox="0 0 320 250" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="162" cy="120" r="104" fill="#D3EDDF"/>
          <g transform="rotate(-9 128 118)">
            <rect x="62" y="44" width="116" height="148" rx="10" fill="#fff" stroke="#9CCFB2" strokeWidth="2"/>
            <rect x="78" y="70" width="52" height="6" rx="3" fill="#D3EDDF"/>
            <rect x="78" y="86" width="78" height="6" rx="3" fill="#E6F2EB"/>
            <rect x="78" y="102" width="66" height="6" rx="3" fill="#E6F2EB"/>
          </g>
          <rect x="122" y="60" width="126" height="158" rx="11" fill="#fff" stroke="#1B9E58" strokeWidth="2.2"/>
          <circle cx="149" cy="89" r="11.5" fill="#E7F6EE" stroke="#1B9E58" strokeWidth="2"/>
          <rect x="169" y="82" width="56" height="7" rx="3.5" fill="#BFE3CE"/>
          <rect x="169" y="95" width="34" height="6" rx="3" fill="#E0F0E7"/>
          <rect x="140" y="122" width="90" height="7" rx="3.5" fill="#E6F2EB"/>
          <rect x="140" y="138" width="72" height="7" rx="3.5" fill="#E6F2EB"/>
          <rect x="140" y="154" width="84" height="7" rx="3.5" fill="#E6F2EB"/>
          <rect x="140" y="176" width="46" height="16" rx="8" fill="#E7F6EE" stroke="#8FCBAA" strokeWidth="1.5"/>
          <circle cx="240" cy="196" r="25" fill="#1B9E58"/>
          <path d="M229 196.5l7.5 7.5 14.5-14.5" stroke="#fff" strokeWidth="3.6"
                strokeLinecap="round" strokeLinejoin="round"/>
          <path d="M62 74l3.4 8 8 3.4-8 3.4-3.4 8-3.4-8-8-3.4 8-3.4z" fill="#9CCFB2"/>
          <circle cx="258" cy="66" r="5.5" fill="#9CCFB2"/>
          <circle cx="70" cy="186" r="7" fill="#BFE3CE"/>
        </svg>
        <h3>Every resume, angled at the JD</h3>
        <p>Pick a profile, paste the job description, and RoleFit moulds the right
           projects, skills and timeline into a resume that actually fits.</p>
      </div>

      <form className="login-form" onSubmit={go}>
        <div className="login-brand">
          <span className="mark">RF</span>
          <span className="word">Role<span>Fit</span></span>
        </div>
        <Err e={e}/>
        {up && <><label>Full name</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Jane Doe"/></>}
        <label>Email</label>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@company.com"/>
        <label>Password</label>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••"/>
        <div style={{marginTop:24}}>
          <Btn busy={b} style={{width:"100%"}}>{up ? "Create account" : "Sign in"}</Btn>
        </div>
        <div className="login-foot">
          {up ? "Already have an account? " : "Are you new? "}
          <button type="button" className="linky" onClick={toggle}>
            {up ? "Sign in" : "Create an account"}
          </button>
        </div>
      </form>
    </div>
  </div>;
}

/* ═══════════════════════ 1. WORKSPACE (§5–§9) ═══════════════════════ */
function Workspace({onStudio}) {
  const [step,setStep]   = useState(1);
  const [vendor,setVen]  = useState("");
  const [jd,setJd]       = useState(
`GenAI Engineer

Experience: 5+ years

Required:
Python
LLM
RAG
LangChain
AWS

Preferred:
FastAPI
Docker
Vector Database`);
  const [req,setReq]     = useState(null);
  const [rows,setRows]   = useState([]);
  const [pick,setPick]   = useState(null);
  const [tpl,setTpl]     = useState("");
  // The design for the resume about to be generated. A JD carries a default,
  // but several resumes are composed against one JD — a different candidate
  // for the same vacancy, or a second attempt for the same candidate — and
  // each of those is allowed its own design. Starts as the JD's choice and is
  // overridden per resume here.
  const [useTpl,setUseTpl] = useState("");
  const [e,setE]         = useState(null), [busy,setBusy] = useState("");
  const [shape,setShape] = useState({company_count:4, project_count:6, target_pages:2});
  const [newTechs,setNewTechs] = useState([]);
  // The resume this wizard just finished, if any. Generating hands the operator
  // over to the studio but leaves this component mounted, so without a record
  // of the handover coming back to Workspace showed the wizard exactly as it
  // was mid-flow -- parked on step 3 with the candidate still selected, as if
  // nothing had happened. This is what makes the finished state visible.
  const [done,setDone]   = useState(null);

  const vendors   = useAsync(()=>api("/vendors").then(list),[]);
  const templates = useAsync(()=>api("/resume-templates").then(list),[]);

  useEffect(()=>{ if(templates.d?.length && !tpl) setTpl(templates.d[0].id); },[templates.d]);
  // Follow the JD's template whenever that changes, so the override is a
  // deliberate act rather than a stale value left over from a previous JD.
  useEffect(()=>{ setUseTpl(tpl); },[tpl]);

  // §5 + §6 — JD becomes a stored Requirement, parsed by AI
  // §5 — parse, and let the user correct and re-parse. Re-parsing edits the
  // requirement already open in this wizard rather than writing a second row
  // for the same vacancy. A requirement belongs to one vendor (§32), so
  // switching vendor genuinely is a new requirement.
  const parse = async () => {
    setBusy("parse"); setE(null); setDone(null);
    const body = {vendor_id:vendor, template_id:tpl || null, raw_jd_text:jd};
    try {
      const reuse = req && req.vendor_id === vendor;
      const r = reuse
        ? await api(`/requirements/${req.id}`,{method:"PATCH",
            body:{raw_jd_text:jd, template_id:tpl || null}})
        : await api("/requirements",{method:"POST", body});
      setReq(r); setStep(2);
    } catch(x){ setE(x.message); } finally { setBusy(""); }
  };

  const newJd = () => {
    setReq(null); setRows([]); setPick(null); setStep(1); setE(null); setDone(null);
  };

  // §7 — vendor-scoped candidate list, no ranking
  const loadProfiles = async () => {
    setBusy("prof"); setE(null);
    try {
      setRows(list(await api(`/availability/requirements/${req.id}/profiles`)));
      setStep(3);
    } catch(x){ setE(x.message); } finally { setBusy(""); }
  };

  // Compose a second resume against the SAME JD -- a different candidate for
  // the vacancy, or another attempt at the same one. Reloads the roster first
  // because the person just reserved is no longer free for this vendor, and a
  // stale list would still be offering them.
  const composeAnother = async () => {
    setBusy("prof"); setE(null); setDone(null); setPick(null); setStep(3);
    try {
      setRows(list(await api(`/availability/requirements/${req.id}/profiles`)));
    } catch(x){ setE(x.message); } finally { setBusy(""); }
  };

  // §9 reserve → §20 session → §19 generate
  const [genSessionId, setGenSessionId] = useState(null);
  const genProgress = useGenerationProgress(genSessionId, busy === "go");
  const start = async () => {
    setBusy("go"); setE(null); setGenSessionId(null);
    try {
      // The knowledge base first: a technology added after composing cannot
      // reach the resume it was added for.
      await commitMissingTechs(req.id, newTechs);
      const res = await api("/reservations",{method:"POST",body:{
        person_id:pick.person_id, vendor_id:vendor, requirement_id:req.id}});
      const s = await api("/resume-sessions",{method:"POST",body:{
        requirement_id:req.id, person_id:pick.person_id,
        // No person_profile_id: the role comes from the JD, which is what
        // selecting somebody for it means. The API creates or reuses that row.
        // The design chosen for THIS resume at step 3, falling back to the
        // JD's. Omitted when neither is set, in which case the session
        // inherits the requirement's template server-side.
        template_id: useTpl || tpl || undefined, reservation_id:res.id}});
      setGenSessionId(s.id);  // the checklist starts polling from here
      const gen = await api(`/resume-sessions/${s.id}/generate`,
                            {method:"POST", body:{options: shape}});
      // What the platform changed on the operator's behalf. Kept in memory for
      // the studio to show once — the durable record is the session's fit score
      // plus the experience warning, not this list.
      GENERATION_NOTES[s.id] = gen.ground_rules || [];
      // Record the handover BEFORE switching tabs, so coming back to Workspace
      // shows a finished wizard rather than the half-filled one it was.
      setDone({session_id:s.id, person_name:pick.person_name});
      setPick(null); setStep(4);
      onStudio(s.id);
    } catch(x){ setE(x.message); }
    finally {
      // Reset on BOTH paths, not just the error one. onStudio() switches the
      // active tab but does not unmount this component -- it stays alive in
      // the background -- so a success path that left `busy` set to "go"
      // meant clicking back to Workspace after a successful generate showed
      // the Reserve button still spinning forever, with no way to start a
      // second resume without a full page reload.
      setBusy(""); setGenSessionId(null);
    }
  };

  const S = n => step===n ? "on" : step>n ? "done" : "";

  return <>
    <div className="steps">
      <div className={S(1)}>1 · Paste JD &amp; vendor</div><span>→</span>
      <div className={S(2)}>2 · Review parsed JD</div><span>→</span>
      <div className={S(3)}>3 · Select profile</div><span>→</span>
      <div className={S(4)}>4 · Resume Studio</div>
    </div>
    <Err e={e}/>

    {/* ── step 1 ── */}
    <div className="card">
      <h3>Step 1 — Vendor &amp; job description</h3>
      <div className="row">
        <div className="grow" style={{maxWidth:280}}>
          <label>Vendor / agency <span className="subtle">chosen before profiles</span></label>
          <select value={vendor} onChange={e=>setVen(e.target.value)}>
            <option value="">Select a vendor…</option>
            {list(vendors.d).map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
          </select>
          <label style={{marginTop:12}}>Resume template</label>
          <select value={tpl} onChange={e=>setTpl(e.target.value)}>
            {list(templates.d).map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
        <div className="grow">
          <label>Paste the job description</label>
          <textarea value={jd} onChange={e=>setJd(e.target.value)}/>
        </div>
      </div>
      <div style={{marginTop:12,display:"flex",gap:10,alignItems:"center"}}>
        <Btn busy={busy==="parse"} disabled={!vendor||!jd.trim()} onClick={parse}>
          {req && req.vendor_id === vendor ? `Re-parse ${req.reference_code}` : "Parse JD with AI"}
        </Btn>
        {req && <button className="btn sec" onClick={newJd}>Start a new JD</button>}
        <span className="subtle">
          {req && req.vendor_id === vendor
            ? "Editing the JD above and re-parsing updates this same requirement."
            : "Creates one requirement row with the vendor, template and parsed JSON."}
        </span>
      </div>
    </div>

    {/* ── step 2 : §14 mandatory vs preferred ── */}
    {req && <div className="card">
      <h3>Step 2 — Parsed requirement · {req.reference_code}</h3>
      <div className="row" style={{marginBottom:12}}>
        <div><label>Role</label><b>{req.parsed_role || "—"}</b></div>
        <div><label>Experience</label><b>{req.min_experience_years ?? "—"}{req.max_experience_years?`–${req.max_experience_years}`:"+"} yrs</b></div>
        <div><label>Location</label><b>{req.location || "—"}</b></div>
        <div><label>Status</label><Chip v={req.status}/></div>
        <div><label>Template</label><b>{req.template_name || "—"}</b></div>
        <div><label>Vendor</label><b>{req.vendor_name}</b></div>
      </div>
      <label>Technologies — importance is decided by this JD, never stored on the master</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:6}}>
        {(req.technologies||[]).map(t=>
          <span key={t.technology_id||t.technology_name} className={"chip "+t.importance}>
            {t.technology_name} · {t.importance}
          </span>)}
        {!req.technologies?.length && <span className="subtle">No technologies extracted.</span>}
      </div>
      {!!(req.responsibilities||[]).length && <>
        <label style={{marginTop:12}}>Responsibilities</label>
        <ul style={{margin:"4px 0",paddingLeft:18,color:"var(--ink2)",fontSize:13}}>
          {req.responsibilities.map((r,i)=><li key={i}>{r}</li>)}
        </ul>
      </>}
      <div style={{marginTop:12}}>
        <Btn busy={busy==="prof"} onClick={loadProfiles}>Show available profiles</Btn>
      </div>
    </div>}

    {/* ── step 4 — the resume is composed and living in the studio now. The
           roster above is stale the moment a reservation is taken, so step 3
           is replaced by this rather than left on screen offering a person who
           is no longer free. ── */}
    {done && <div className="card">
      <h3>Step 4 — Resume composed <span className="subtle">{req?.reference_code}</span></h3>
      <p style={{margin:"6px 0 14px",color:"var(--ink2)"}}>
        <b>{done.person_name}</b> is reserved for this vendor and the first version
        is open in the Resume Studio.
      </p>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        <button className="btn" onClick={()=>onStudio(done.session_id)}>
          Open in Resume Studio
        </button>
        <Btn busy={busy==="prof"} className="btn sec" onClick={composeAnother}>
          Compose another for this JD
        </Btn>
        <button className="btn sec" onClick={newJd}>Start a new JD</button>
      </div>
    </div>}

    {/* ── step 3 : §7 + §8 ── */}
    {step>=3 && !done && <div className="card">
      <h3>Step 3 — Available profiles for this vendor <span className="subtle">no ranking score</span></h3>
      <div className="scroll">
        <table>
          {/* No role and no skills column. A person holds neither: the role is
              whatever this JD asks for, and what the resume claims is composed
              for it out of the shared bank. Either column could only report
              some other JD's answer, dressed up as a fact about the candidate.
              What is left is what this step actually decides — who is free. */}
          <thead><tr>
            <th>Profile</th><th>Current engagement</th>
            <th>Vendor status</th><th>Availability</th>
          </tr></thead>
          <tbody>
            {rows.map(r=>
              <tr key={r.person_id}
                  className={pick?.person_id===r.person_id?"sel":""}
                  style={{cursor:r.is_selectable?"pointer":"not-allowed",opacity:r.is_selectable?1:.5}}
                  onClick={()=>r.is_selectable&&setPick(r)}>
                <td><b>{r.person_name}</b></td>
                <td className="subtle">{r.current_engagement_label||"—"}</td>
                <td><Chip v={r.vendor_status}/></td>
                <td>{r.is_selectable
                      ? <span className="chip ok">Available</span>
                      : <span className="chip na">Not available</span>}</td>
              </tr>)}
            {!rows.length && <tr><td colSpan="4" className="empty">No profiles returned for this vendor.</td></tr>}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:14, paddingTop:12, borderTop:"1px solid var(--line)"}}>
        <label style={{fontWeight:600}}>Design for this resume</label>
        <div className="row" style={{alignItems:"flex-start"}}>
          <div className="grow" style={{maxWidth:320}}>
            <select value={useTpl} onChange={ev=>setUseTpl(ev.target.value)}>
              {list(templates.d).map(t=>
                <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <div className="subtle" style={{flex:1,fontSize:12,paddingTop:6}}>
            {(() => {
              const chosen = list(templates.d).find(t => t.id === useTpl);
              if (!chosen) return "Pick the design this resume prints into.";
              return <>
                {chosen.description}
                {chosen.section_titles?.length
                  ? <> <b>Sections:</b> {chosen.section_titles.join(" · ")}</>
                  : null}
                {useTpl && tpl && useTpl !== tpl
                  ? <div style={{marginTop:4}}>
                      Different from this JD&rsquo;s default — only this resume changes.
                    </div>
                  : null}
              </>;
            })()}
          </div>
        </div>
      </div>

      <div style={{marginTop:14, paddingTop:12, borderTop:"1px solid var(--line)"}}>
        <label style={{fontWeight:600}}>Shape of the resume</label>
        <ShapeForm value={shape} onChange={setShape}/>
      </div>
      <MissingTechs requirementId={req?.id} value={newTechs} onChange={setNewTechs}/>
      <div style={{marginTop:12,display:"flex",gap:10,alignItems:"center"}}>
        <Btn busy={busy==="go"}
             disabled={!pick || newTechs.some(x=>!x.release_year)}
             onClick={start}>
          {pick ? `Reserve ${pick.person_name} & generate resume` : "Select a profile above"}
        </Btn>
        <span className="subtle">Reserving locks this person for this vendor only.</span>
      </div>
      <GenerationChecklist progress={genProgress}/>
    </div>}
  </>;
}

/* ═══════════════════ 2. RESUME STUDIO (§21–§25) ═══════════════════ */

/* House rules the generator applied, by session id. Written when version 1 is
   generated and read once by the studio; see GENERATION_NOTES above. */
const GENERATION_NOTES = {};
const EXAMPLES = [
  "Rewrite the summary around the JD's responsibilities.",
  "Add a Kubernetes migration project under Infosys, 2021 to 2022.",
  "Change my title at Acme to Senior DevOps Engineer.",
  "Remove the second project and move AWS to the top of the skills.",
  "Make Beta Corp run from Jan 2020 to Dec 2021.",
  "Put the education section back.",
];

/* The content window — the chosen template's own sections, editable.
   Every row is the design's section, not a field this app believes in: a
   template whose summary is called "Profile" says Profile, and a template
   with no Education section never offers one. Each change is a versioned
   edit and the design preview on the left redraws from it. */
function SectionWindow({ sessionId, locked, after, currentVersionId, onRestore }) {
  const w = useAsync(() => api(`/resume-sessions/${sessionId}/sections`), [sessionId]);
  const [busy, setBusy] = useState("");
  const [e, setE] = useState(null);
  const [adding, setAdding] = useState(false);
  const [title, setTitle] = useState("");
  // The version this session was on right before the most recent action here —
  // captured at click time, before the action moves the pointer forward, so
  // Undo has somewhere to go back to. Cleared once used, or once locked.
  const [undo, setUndo] = useState(null);

  const act = async (body, key) => {
    setBusy(key); setE(null);
    const before = currentVersionId;
    try {
      await api(`/resume-sessions/${sessionId}/sections`, { method: "POST", body });
      await w.reload(); after && after();
      setUndo(before ? before : null);
    } catch (x) { setE(x.message); } finally { setBusy(""); }
  };

  const undoLast = async () => {
    if (!undo) return;
    setBusy("undo"); setE(null);
    try { await onRestore(undo, { mark_undone: true }); setUndo(null); }
    catch (x) { setE(x.message); } finally { setBusy(""); }
  };

  const rows = w.d?.sections || [];
  const unused = w.d?.unused || [];

  return <div className="rbody">
    <Err e={e} />
    <div className="hint">
      These are <b>{w.d?.template_name || "this template"}</b>&rsquo;s own sections, in its
      order and its wording. Hide one and it stops printing but keeps its content;
      add one and it prints through the template&rsquo;s own section macro, so it looks
      like it was always there. {w.d?.is_fillable === false &&
        <span> This template has not been converted to a fillable design yet, so
          changes here may not reach the PDF — re-run the conversion from Templates.</span>}
    </div>

    {!!undo && !locked &&
      <div className="fmt-note" style={{marginBottom:10, display:"flex", alignItems:"center", gap:10}}>
        <span>Change applied.</span>
        <button className="btn sec sm" disabled={busy==="undo"} onClick={undoLast}>
          {busy==="undo" ? "Undoing…" : "Undo"}</button>
      </div>}

    {rows.map((r, i) =>
      <div key={r.key || i} className="warn-item" style={{ opacity: r.enabled ? 1 : .55 }}>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <b>{r.title}</b>
          <span className="chip">{r.kind}</span>
          {r.added && <span className="chip info">added</span>}
          {!r.enabled && <span className="chip">hidden</span>}
          <span className="subtle" style={{ fontSize: 12 }}>{r.content_label}</span>
        </div>
        {!locked && <div style={{ marginTop: 8, display: "flex", gap: 6, flexWrap: "wrap" }}>
          <button className="btn sec sm" disabled={!!busy || i === 0}
            onClick={() => act({ action: "move", section: r.key, direction: "up" }, r.key + "u")}>↑</button>
          <button className="btn sec sm" disabled={!!busy || i === rows.length - 1}
            onClick={() => act({ action: "move", section: r.key, direction: "down" }, r.key + "d")}>↓</button>
          <button className="btn sec sm" disabled={!!busy}
            onClick={() => act({ action: r.enabled ? "hide" : "show", section: r.key }, r.key + "t")}>
            {r.enabled ? "Hide" : "Show"}</button>
          <button className="btn sec sm" disabled={!!busy}
            onClick={() => {
              const t = prompt("Heading for this section", r.title);
              if (t && t.trim() && t !== r.title) act({ action: "rename", section: r.key, title: t.trim() }, r.key + "r");
            }}>Rename</button>
          <button className="btn sec sm" disabled={!!busy}
            onClick={() => {
              const msg = r.added
                ? `Remove "${r.title}"? It was added here and this deletes its content too — this cannot be undone.`
                : `Remove "${r.title}" from this resume? Its content is kept and Show brings it back.`;
              if (confirm(msg)) act({ action: "remove", section: r.key, purge: !!r.added }, r.key + "x");
            }}>
            Remove</button>
        </div>}
      </div>)}

    {!rows.length && <div className="empty">
      This template has no section list yet. Upload it as a .tex (or a .zip of its
      Overleaf project) and its sections are read at upload.
    </div>}

    {!!unused.length && !locked && <div className="fmt-note" style={{ marginTop: 12 }}>
      <b>On this resume, but nowhere to print it</b>
      <div>This design has no section for the following. Add one and it prints
        in the template&rsquo;s own style.</div>
      {unused.map(u =>
        <div key={u.kind} style={{ marginTop: 6, display: "flex", gap: 8, alignItems: "center" }}>
          <span>{u.suggested_title}</span>
          <span className="subtle" style={{ fontSize: 12 }}>{u.content_label}</span>
          <button className="btn sec sm" disabled={!!busy}
            onClick={() => act({ action: "add", title: u.suggested_title, kind: u.kind }, u.kind)}>
            Add section</button>
        </div>)}
    </div>}

    {!locked && <div style={{ marginTop: 12 }}>
      {adding
        ? <div className="row">
            <div className="grow"><label>New section heading</label>
              <input autoFocus value={title} onChange={ev => setTitle(ev.target.value)}
                placeholder="Publications" /></div>
            <Btn busy={busy === "add"} onClick={() => {
              if (title.trim()) act({ action: "add", title: title.trim() }, "add")
                .then(() => { setTitle(""); setAdding(false); });
            }}>Add</Btn>
            <button className="btn sec" onClick={() => setAdding(false)}>Cancel</button>
          </div>
        : <button className="btn sec sm" onClick={() => setAdding(true)}>+ Add a section</button>}
    </div>}
  </div>;
}

function Studio({sessionId, onExit, onApproved}) {
  const [tab,setTab]   = useState("chat");
  const [html,setHtml] = useState("");
  const [view,setView] = useState("content");     // content | design
  const [pdfUrl,setPdfUrl] = useState(null);
  const [pdfBusy,setPdfBusy] = useState(false);
  const [pdfErr,setPdfErr] = useState(null);
  const [msgs,setMsgs] = useState([]);
  const [text,setText] = useState("");
  const [e,setE]       = useState(null), [busy,setBusy] = useState("");
  const [done,setDone] = useState(null);
  const endRef = useRef();

  const sess = useAsync(()=>api(`/resume-sessions/${sessionId}`),[sessionId]);
  const warn = useAsync(()=>api(`/resume-sessions/${sessionId}/warnings`).then(list),[sessionId]);
  const vers = useAsync(()=>api(`/resume-sessions/${sessionId}/versions`).then(list),[sessionId]);

  // Two genuinely different views. The HTML one renders from a layout
  // definition and looks identical whichever template the session uses — an
  // uploaded .tex or .pdf has no layout definition to render from. Only the
  // compiled PDF shows the design that was actually chosen, which is why the
  // toggle names them rather than calling both "preview".
  const refreshDesign = useCallback(async () => {
    setPdfErr(null); setPdfBusy(true);
    try {
      const r = await fetch(`/api/v1/resume-sessions/${sessionId}/preview.pdf`,
        { headers: { Authorization: `Bearer ${TOKEN}` } });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        throw new Error(d?.error?.message || d?.detail || `HTTP ${r.status}`);
      }
      const blob = await r.blob();
      setPdfUrl(u => { if (u) URL.revokeObjectURL(u); return URL.createObjectURL(blob); });
    } catch (x) { setPdfErr(String(x.message || x)); } finally { setPdfBusy(false); }
  }, [sessionId]);

  const refreshPreview = useCallback(async () => {
    try { setHtml(await api(`/resume-sessions/${sessionId}/preview`,{raw:true})); }
    catch(x){ setE(x.message); }
  },[sessionId]);

  useEffect(()=>{ refreshPreview(); },[refreshPreview]);
  useEffect(()=>{
    // §22 — the server returns one row per turn (role "user" or "assistant"),
    // not a paired {user_message, assistant_reply} shape. Reopening a session
    // must show the same conversation that was here before it was closed.
    api(`/resume-sessions/${sessionId}/chat`).then(d=>{
      setMsgs(list(d).map(i=>({
        r: i.role === "user" ? "u" : "a",
        t: i.message,
        tools: (i.tool_calls||[]).map(c=>c.tool||c.name),
      })).filter(m=>m.t));
    }).catch(()=>{});
  },[sessionId]);
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs]);

  const after = () => { refreshPreview(); warn.reload(); vers.reload(); sess.reload(); };

  // §22 — natural-language instruction
  const send = async () => {
    const m = text.trim(); if(!m) return;
    setMsgs(x=>[...x,{r:"u",t:m}]); setText(""); setBusy("chat"); setE(null);
    try {
      const r = await api(`/resume-sessions/${sessionId}/chat`,{method:"POST",body:{message:m}});
      setMsgs(x=>[...x,{r:"a",t:r.reply,tools:(r.tool_calls||[]).map(c=>c.tool||c.name)}]);
      after();
      if (r.warnings?.length) setTab("warn");
    } catch(x){ setE(x.message); } finally { setBusy(""); }
  };

  // §25 — [Keep] / [Modify] decision
  const decide = async (id,status) => {
    try { await api(`/resume-sessions/${sessionId}/warnings/${id}/decision`,
                    {method:"POST",body:{status,note:`Marked ${status} from Resume Studio`}});
          warn.reload(); }
    catch(x){ setE(x.message); }
  };

  const restore = async (vid, opts={}) => {
    setBusy("v"); setE(null);
    try {
      await api(`/resume-sessions/${sessionId}/versions/${vid}/restore`,
                 {method:"POST",body:opts});
      after();
    }
    catch(x){ setE(x.message); throw x; } finally { setBusy(""); }
  };

  // §23 — approval is always human. The server runs a fresh verification pass
  // on click and refuses to approve while any warning is still OPEN, so a
  // blocked attempt still needs the warnings list reloaded — that's where the
  // newly-raised findings the user must act on now live.
  const approve = async () => {
    setBusy("ap"); setE(null);
    try { setDone(await api(`/resume-sessions/${sessionId}/approve`,{method:"POST",body:{}})); after(); }
    catch(x){ setE(x.message); warn.reload(); } finally { setBusy(""); }
  };

  const open = list(warn.d).filter(w=>w.status==="OPEN");
  const s = sess.d;
  // EDITING is the only status this studio may write to. Approving moves the
  // session to RESERVED and beyond — a hold with a decision pending, not a
  // draft — so the edit controls stop there: no further chat edits, warning
  // decisions, composition changes or version restores.
  //
  // Normally nobody sees this state for long: pressing Done after approving
  // closes the studio for good (the shell drops the session, greying the tab)
  // and moves to Reservations, and the only way back in is a hold that lapses,
  // which returns the session to EDITING first. This flag is what makes that
  // true wherever the session is reached from, because it reads the session's
  // own status rather than local state from this one visit.
  const locked = !!s && s.status !== "EDITING";
  const currentVersion = list(vers.d).find(v => v.version_no === s?.current_version_no);
  const approvedFiles = done?.files || currentVersion?.files || [];

  // A session that will not load — a bookmarked or shared link to one that has
  // since been cleared. The studio chrome around an empty session renders
  // perfectly happily and says nothing, which reads as a broken app rather
  // than a dead link, so say which it is and give a way out.
  if (sess.e && !s) return <div className="studio">
    <div style={{margin:"auto", maxWidth:520, padding:"0 24px", textAlign:"center"}}>
      <Err e={sess.e}/>
      <p className="subtle" style={{marginBottom:18}}>
        This link points at a resume session that is no longer here.
      </p>
      <button className="btn" onClick={onExit}>Go to history</button>
    </div>
  </div>;

  return <div className="studio">
    {/* LEFT — live preview */}
    <div className="left">
      <div className="pvhead">
        <b>Live resume preview</b>
        {s && <span className="subtle">
          {s.person_name} · {s.profile_title} · {s.vendor_name} · v{s.current_version_no}
        </span>}
        <Chip v={s?.status}/>
        <span className="actions">
          <button className={"btn sm " + (view==="content" ? "" : "sec")}
                  onClick={()=>setView("content")}>Content</button>
          <button className={"btn sm " + (view==="design" ? "" : "sec")}
                  onClick={()=>{ setView("design"); if(!pdfUrl) refreshDesign(); }}>
            Design{s?.template_name ? ` · ${s.template_name}` : ""}
          </button>
          <button className="btn sec sm"
                  onClick={()=> view==="design" ? refreshDesign() : refreshPreview()}>Refresh</button>
          <button className="btn sec sm" onClick={onExit}>Close</button>
        </span>
      </div>
      {view === "content"
        ? <iframe title="content preview" srcDoc={html}/>
        : pdfBusy
        ? <div className="empty" style={{padding:40}}>
            Compiling this version through <b>{s?.template_name || "the template"}</b>…
            the first run for a version also composes the LaTeX, which takes a minute.
          </div>
        : pdfErr
        ? <div style={{padding:20}}><Err e={pdfErr}/>
            <div className="subtle">The Content view still works — it renders the
            text without the template's design.</div></div>
        : pdfUrl
        ? <iframe title="design preview" src={pdfUrl}/>
        : <div className="empty" style={{padding:40}}>Press Refresh to compile the design.</div>}
      {view === "content" &&
        <div className="subtle" style={{padding:"4px 10px",fontSize:11,borderTop:"1px solid var(--line)"}}>
          Content view — text and ordering only. Switch to <b>Design</b> to see
          {s?.template_name ? ` "${s.template_name}"` : " the chosen template"} as it will be sent.
        </div>}
    </div>

    {/* RIGHT — assistant */}
    <div className="right">
      <div className="rtabs">
        <button className={tab==="chat"?"on":""} onClick={()=>setTab("chat")}>AI Assistant</button>
        <button className={tab==="warn"?"on":""} onClick={()=>setTab("warn")}>
          Warnings{open.length>0 && <span className="badge">{open.length}</span>}
        </button>
        <button className={tab==="sec"?"on":""}  onClick={()=>setTab("sec")}>Sections</button>
        <button className={tab==="sel"?"on":""}  onClick={()=>setTab("sel")}>Composition</button>
        <button className={tab==="ver"?"on":""}  onClick={()=>setTab("ver")}>Versions</button>
      </div>

      {tab==="chat" && <>
        <div className="rbody">
          <Err e={e}/>
          {locked
            ? <div className="hint">
                This resume is <b>{s.status}</b> — it has been approved and sent on, so there is
                {" "}nothing left to edit here.
              </div>
            : <div className="hint">
                Try: {EXAMPLES.map((x,i)=>
                  <span key={i}><b onClick={()=>setText(x)}>{x}</b>{i<EXAMPLES.length-1?" · ":""}</span>)}
              </div>}
          {msgs.map((m,i)=>
            <div key={i} className={"msg "+m.r}>
              <div className="b">{m.t}</div>
              {!!m.tools?.length && <div className="tools">
                applied {m.tools.map((t,j)=><code key={j}>{t}</code>)}
              </div>}
            </div>)}
          {!msgs.length && <div className="empty">Ask for a change and the preview updates on the left.</div>}
          <div ref={endRef}/>
        </div>
        {!locked &&
          <div className="chatbox">
            <textarea value={text} placeholder="Make the summary more focused on GenAI…"
              onChange={e=>setText(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}/>
            <Btn busy={busy==="chat"} onClick={send}>Send</Btn>
          </div>}
      </>}

      {tab==="sec" &&
        <SectionWindow sessionId={sessionId} locked={locked} after={after}
                        currentVersionId={s?.current_version_id} onRestore={restore}/>}

      {tab==="warn" && <div className="rbody">
        <Err e={e}/>
        <div className="hint">
          Only checkable facts are flagged: a technology dated before it existed,
          a skill name that matches nothing on record, the experience total, a
          JD skill missing from the database, a role with no direct match in the
          bank, and — at approval — a language, grammar or fact-check pass over
          the final resume. Every warning needs a decision (Keep/Modify/Dismiss)
          before the resume can be approved.
        </div>

        {/* How version 1 was built. The fit score chose between transforming the
            stored history as-is and moulding it toward the JD's role. */}
        {s?.fit_basis &&
          <div className="warn-item INFO">
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <span className="chip info">How this was built</span>
            </div>
            <p>{s.fit_basis}</p>
            {!!(GENERATION_NOTES[sessionId]||[]).length &&
              <ul style={{margin:"6px 0 0 16px",padding:0,fontSize:12,opacity:.85}}>
                {GENERATION_NOTES[sessionId].map((r,i)=><li key={i}>{r}</li>)}
              </ul>}
          </div>}
        {list(warn.d).map(w=>
          <div key={w.id} className={"warn-item "+w.severity}>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <Chip v={w.severity}/><Chip v={w.status}/>
              <span className="subtle mono" style={{fontSize:11}}>{w.warning_type}</span>
            </div>
            <p>{w.message}</p>
            {w.claim_text && <div className="claim">“{w.claim_text}”</div>}
            {w.status==="OPEN" && !locked && <div style={{marginTop:9,display:"flex",gap:7}}>
              <button className="btn sm" onClick={()=>decide(w.id,"KEPT")}>Keep</button>
              <button className="btn sec sm" onClick={()=>decide(w.id,"MODIFIED")}>Mark modified</button>
              <button className="btn sec sm" onClick={()=>decide(w.id,"DISMISSED")}>Dismiss</button>
            </div>}
            {w.status==="OPEN" && locked &&
              <div className="subtle" style={{marginTop:6,fontSize:12}}>
                Left open when this resume was approved.
              </div>}
            {w.decision_note && <div className="subtle" style={{marginTop:6}}>Note: {w.decision_note}</div>}
          </div>)}
        {!list(warn.d).length && <div className="empty">No validation warnings on this resume.</div>}
      </div>}

      {tab==="sel" && <div className="rbody">
        <Err e={e}/>
        {locked
          ? <div className="hint">
              This resume is <b>{s.status}</b> — it has been approved and sent on, so its
              {" "}project and company picks are settled.
            </div>
          : <>
              <div className="hint">
                Pair any project with any company, compose new ones, and set the timeline.
                This resume only; the master pool is never modified.
              </div>
              <Composition session={s} sessionId={sessionId} onSaved={after}/>
            </>}
      </div>}

      {tab==="ver" && <div className="rbody">
        <Err e={e}/>
        <div className="hint">
          Every generation and edit cycle creates a version.
          {locked && " This resume has been approved, so restoring an earlier one is no longer possible."}
        </div>
        <div className="scroll">
          <table>
            <thead><tr><th>V</th><th>Change</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {list(vers.d).sort((a,b)=>b.version_no-a.version_no).map(v=>
                <tr key={v.id}>
                  <td><b>v{v.version_no}</b></td>
                  {/* Restoring repoints the session at this version instead of
                      copying it forward, so there is no "Restored from V3" row
                      burying the versions that carry real work. What happened
                      shows here instead, quietly, under the change it belongs
                      to. */}
                  <td>{v.change_summary||v.change_origin||"—"}
                    {v.restore_note &&
                      <div className="subtle" style={{fontSize:11, marginTop:2, fontStyle:"italic"}}>
                        {v.restore_note}
                      </div>}
                  </td>
                  <td><Chip v={v.status}/></td>
                  <td>{v.version_no===s?.current_version_no
                    ? <span className="chip info">Current</span>
                    // Undone via the Sections tab's inline Undo, as opposed to
                    // merely superseded by later work — that stays restorable,
                    // this was deliberately retired and stays retired.
                    : v.is_undone
                    ? <span className="chip" title="Undone from the Sections tab">Undone</span>
                    : v.status!=="APPROVED" && !locked &&
                      <button className="btn sec sm" disabled={busy==="v"}
                              onClick={()=>{
                                if (confirm(`Restore v${v.version_no}? This resume will go back to `+
                                            `exactly what it said then — v${s?.current_version_no} `+
                                            `stays in this list and can be restored again.`))
                                  restore(v.id);
                              }}>Restore</button>}</td>
                </tr>)}
            </tbody>
          </table>
        </div>
      </div>}

      {/* action bar — §21 */}
      <div className="bar">
        {!locked
          ? <>
              <Btn busy={busy==="ap"} className="btn ok" onClick={approve}>
                Approve resume
              </Btn>
              <span className="subtle" style={{alignSelf:"center"}}>
                {open.length
                  ? `${open.length} open warning${open.length>1?"s":""} — your call, approval does not need them resolved`
                  : "No open warnings on this resume"}
              </span>
            </>
          : <>
              <span className="chip ok" style={{alignSelf:"center"}}>
                Approved v{done?.version_no ?? s?.current_version_no}
              </span>
              {approvedFiles.map(f=>
                <button key={f.id} className="btn sm" onClick={()=>download(f.id,f.file_name)}>
                  Download {f.file_format}
                </button>)}
              {/* Only present right after approving in this same view — this is
                  the one moment "done" means "I'm finished here", not just
                  "this session is locked", so it is the only path to
                  Reservations rather than back to History. */}
              {done && <button className="btn sec sm" onClick={onApproved}>Done</button>}
            </>}
      </div>
    </div>
  </div>;
}

/* companies <option> list, loaded once and reused inside the composition tab */
let COMPANY_CACHE = null;
function Companies() {
  const [c,setC] = useState(COMPANY_CACHE||[]);
  useEffect(()=>{
    if (COMPANY_CACHE) return;
    api("/companies",{params:{limit:200}}).then(d=>{ COMPANY_CACHE=list(d); setC(COMPANY_CACHE); }).catch(()=>{});
  },[]);
  return <>{c.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</>;
}

/* ────────────────────── §17 composition: mix and match ──────────────────────

   Everything on this panel is a per-resume override. A row may point at a bank
   project, at a bank project shown under a different company, or at nothing at
   all — the last is a project composed here, which lives on this resume only.

   Edits are staged locally and sent in one PUT, because the API replaces the
   whole selection list: saving each keystroke would drop the rows still being
   typed into.                                                                */
/* The one-page shape, mirrored from app/config (RESUME_MIN/MAX_*). The API
   enforces it — these numbers only stop the operator building a selection that
   would be rejected on save. */
/* The shape of a resume is the SERVER's rule (RESUME_MIN/MAX_PROJECTS and
   RESUME_MIN/MAX_COMPANIES in app/config), and it is configurable per
   deployment. These were hard-coded to 5 here and had drifted out of step
   with a config saying 8 projects and 6 employers, so a perfectly legal
   six-project resume rendered as "6 of 5", refused to let another be added,
   and announced that the page was full when it was not. The counts below are
   shown plainly and the server stays the only authority on the limit — it
   already rejects an over-long selection with a message naming its own
   number. */

/* No role_override. A project does not carry a job title on this resume — the
   only title printed is the employer's designation, which comes from the JD's
   role and the era rules. Asking for one per project invited a second title
   that no design prints and no reader expects. */
const BLANK_PROJECT = {
  project_id: null, display_order: 0, is_primary: false,
  title_override: "", description_override: "",
  responsibilities_override: null, achievements_override: null,
  technologies_override: null, company_id: null,
  _name: "", _composed: true,
};

function Composition({session, sessionId, onSaved}) {
  const [rows,setRows]   = useState([]);
  const [exp,setExp]     = useState([]);
  const [busy,setBusy]   = useState("");
  const [e,setE]         = useState(null);
  const [dirty,setDirty] = useState(false);
  const [adding,setAdd]  = useState(false);

  // MAX_LIMIT on every list endpoint is 200; asking for more is a 422, not a
  // truncated list, and the empty dropdown that produced looked like "the bank
  // is empty" rather than "the request was rejected".
  const PAGE_MAX = 200;
  const companies = useAsync(()=>api("/companies",{params:{limit:PAGE_MAX}}).then(list),[]);
  // §17 — the whole bank, not just this person's work. Mix-and-match exists so a
  // project delivered by one person can be presented on another's resume; the
  // picker splits them so the operator always knows which they are reaching for.
  const pool = useAsync(()=>api("/projects",{params:{limit:PAGE_MAX}}).then(list),[]);

  // Re-seed from the server whenever the session reloads, unless the operator
  // has unsaved edits — clobbering those would be worse than a stale list.
  useEffect(()=>{
    if (!session || dirty) return;
    setRows((session.selected_projects||[]).map(p=>({
      project_id: p.project_id,
      display_order: p.display_order, is_primary: !!p.is_primary,
      title_override: p.title_override||"",
      description_override: p.description_override||"",
      company_id: p.company_id || null,
      responsibilities_override: p.responsibilities_override,
      achievements_override: p.achievements_override,
      technologies_override: p.technologies_override,
      _name: p.project_name||"(untitled)", _composed: !!p.is_composed,
    })));
    setExp((session.selected_companies||[]).map(c=>({
      company_id: c.company_id, display_order: c.display_order,
      designation_override: c.designation_override||"",
      start_date_override: c.start_date_override||"",
      end_date_override: c.end_date_override||"",
      _name: c.company_name||"(unknown)",
    })));
  },[session, dirty]);

  const editRow = (i,patch) => { setRows(r=>r.map((x,j)=>j===i?{...x,...patch}:x)); setDirty(true); };
  const editExp = (i,patch) => { setExp(r=>r.map((x,j)=>j===i?{...x,...patch}:x)); setDirty(true); };
  // Up/down sits next to a company's own project list, so "up" has to mean
  // "earlier among THIS company's projects" -- not "earlier in the flat
  // array". rows from every company are interleaved in that array, so
  // swapping raw neighbours could just as easily swap with a different
  // company's project (or an unfiled one), which looked like the arrow doing
  // nothing to the row you were looking at, or moving the wrong row instead.
  const move = (i,d) => {
    setRows(r=>{
      const row = r[i];
      if (!row) return r;
      const siblings = r.map((x,j)=>j).filter(j=>r[j].company_id===row.company_id);
      const pos = siblings.indexOf(i), t = pos+d;
      if (pos<0 || t<0 || t>=siblings.length) return r;
      const n=[...r], other=siblings[t];
      [n[i],n[other]]=[n[other],n[i]];
      return n;
    });
    setDirty(true);
  };
  const drop    = i => { setRows(r=>r.filter((_,j)=>j!==i)); setDirty(true); };
  const dropExp = i => {
    // The projects filed under it lose their employer rather than disappearing:
    // they show under "Not filed under an employer", where they can be moved or
    // removed deliberately. Deleting somebody's work as a side effect of
    // removing a company would be the wrong default.
    const goneId = exp[i]?.company_id;
    setExp(r=>r.filter((_,j)=>j!==i));
    setRows(r=>r.map(x=>x.company_id===goneId?{...x, company_id:null}:x));
    setDirty(true);
  };
  const primary = i => { setRows(r=>r.map((x,j)=>({...x,is_primary:j===i}))); setDirty(true); };

  // Both take the employer they are being added under, because that is the
  // only place a project can be added from now — the page is grouped by
  // employer, so "add a project" always means "add one here".
  const addFromBank = (id, companyId=null) => {
    const p = list(pool.d).find(x=>x.id===id);
    if (!p) return;
    // No overrides: an empty override means "use what the bank recorded", so the
    // row renders exactly as the project really is until someone changes it.
    setRows(r=>[...r,{...BLANK_PROJECT, project_id:p.id, _name:p.name,
                      _composed:false, company_id:companyId}]);
    setDirty(true);
  };
  const addComposed = (companyId=null) => {
    setRows(r=>[...r,{...BLANK_PROJECT, title_override:"New project",
                      _name:"New project", company_id:companyId}]);
    setDirty(true); setAdd(true);
  };

  // Point an experience row at a different company, carrying its projects
  // across. Without the second half, changing the employer would silently
  // orphan every project filed under the old one.
  const swapCompany = (i, newId) => {
    const c = list(companies.d).find(x=>x.id===newId);
    if (!c) return;
    const oldId = exp[i]?.company_id;
    setExp(r=>r.map((x,j)=>j===i?{...x, company_id:c.id, _name:c.name}:x));
    setRows(r=>r.map(x=>x.company_id===oldId?{...x, company_id:c.id}:x));
    setDirty(true);
  };

  // §17 — an experience row is a company plus the title and dates shown against
  // it. Companies are a shared pool, unlinked to any person, so any company in
  // the bank can be added.
  const addExperience = id => {
    const c = list(companies.d).find(x=>x.id===id);
    if (!c) return;
    setExp(r=>[...r,{company_id:c.id, display_order:r.length,
                     designation_override:"", start_date_override:"",
                     end_date_override:"", _name:c.name}]);
    setDirty(true);
  };
  const moveExp = (i,d) => {
    setExp(r=>{ const n=[...r], t=i+d; if(t<0||t>=n.length) return n;
                [n[i],n[t]]=[n[t],n[i]]; return n; });
    setDirty(true);
  };

  const save = async (rebuild) => {
    setBusy(rebuild?"rebuild":"save"); setE(null);
    try {
      await api(`/resume-sessions/${sessionId}/selections`,{method:"PUT",body:{
        projects: rows.map((r,i)=>({
          project_id: r.project_id,
          display_order: i,
          is_primary: !!r.is_primary,
          title_override: r.title_override||null,
          description_override: r.description_override||null,
          company_id: r.company_id||null,
          responsibilities_override: r.responsibilities_override,
          achievements_override: r.achievements_override,
          technologies_override: r.technologies_override,
        })),
        companies: exp.map((c,i)=>({
          company_id: c.company_id,
          display_order: i,
          designation_override: c.designation_override||null,
          start_date_override: c.start_date_override||null,
          end_date_override: c.end_date_override||null,
        })),
      }});
      if (rebuild) await api(`/resume-sessions/${sessionId}/rebuild`,{method:"POST",body:{}});
      setDirty(false);
      onSaved?.();
    } catch(x){ setE(x.message); } finally { setBusy(""); }
  };

  const csv  = v => (v||[]).join(", ");
  const arr  = v => { const a=(v||"").split(",").map(x=>x.trim()).filter(Boolean); return a.length?a:null; };
  const used = new Set(rows.map(r=>r.project_id).filter(Boolean));
  // A project may appear once per resume (uq_session_project), so anything
  // already on the resume is filtered out of the picker rather than offered and
  // then rejected by the API.
  const free  = list(pool.d).filter(p=>!used.has(p.id));
  // Same rule for experience: one row per company (uq_session_company).
  const usedCo = new Set(exp.map(c=>c.company_id));
  const freeCo = list(companies.d).filter(c=>!usedCo.has(c.id));
  const box  = {border:"1px solid var(--line)",borderRadius:4,padding:10,marginBottom:9};
  const half = {display:"grid",gridTemplateColumns:"1fr 1fr",gap:6};

  return <>
    <Err e={e}/>
    {/* A failed pool load used to show as an empty picker, which reads as "the
        bank has nothing" — say what actually happened instead. */}
    <Err e={pool.e && `Could not load the project bank: ${pool.e}`}/>
    <Err e={companies.e && `Could not load the company list: ${companies.e}`}/>

    {/* One section, grouped the way the resume prints: an employer, then the
        projects filed under it. These were two flat lists, so the pairing that
        decides where a project appears was invisible here and changeable only
        by regenerating. */}
    <h4 style={{margin:"4px 0 8px",fontSize:12,letterSpacing:".04em",textTransform:"uppercase"}}>
      Experience &amp; projects <span className="subtle" style={{textTransform:"none",letterSpacing:0}}>
        {exp.length} employer{exp.length===1?"":"s"} &middot; {rows.length} project{rows.length===1?"":"s"}
      </span>
    </h4>
    <div className="hint">
      Each project prints under the employer it is filed against — move one with its
      <b> Employer</b> list. Dates print as-is; version 1 already spread the employment
      across these companies to cover the JD&rsquo;s experience requirement.
    </div>

    {exp.map((c,i)=>{
      const mine = rows.map((r,ri)=>({r,ri})).filter(x=>x.r.company_id===c.company_id);
      return <div key={c.company_id||i} style={box}>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <b style={{fontSize:13}}>{c._name}</b>
          <span className="chip">{mine.length} project{mine.length===1?"":"s"}</span>
          <span style={{marginLeft:"auto",display:"flex",gap:4}}>
            <button className="btn sec sm" title="Move up"   onClick={()=>moveExp(i,-1)}>&uarr;</button>
            <button className="btn sec sm" title="Move down" onClick={()=>moveExp(i, 1)}>&darr;</button>
            <button className="btn sec sm" onClick={()=>dropExp(i)}>Remove</button>
          </span>
        </div>

        <label>Employer</label>
        {/* Swapping the company keeps its projects filed against it, so "this
            work was really done at X" is one change rather than re-pairing
            every project underneath by hand. */}
        <select value={c.company_id||""} onChange={ev=>swapCompany(i,ev.target.value)}>
          {list(companies.d).map(x=>
            <option key={x.id} value={x.id}
                    disabled={x.id!==c.company_id && usedCo.has(x.id)}>{x.name}</option>)}
        </select>

        <label>Designation</label>
        <input value={c.designation_override} placeholder="as recorded"
               onChange={ev=>editExp(i,{designation_override:ev.target.value})}/>
        <div style={half}>
          <div>
            <label>From</label>
            <input value={c.start_date_override} placeholder="Jan 2022"
                   onChange={ev=>editExp(i,{start_date_override:ev.target.value})}/>
          </div>
          <div>
            <label>To</label>
            <input value={c.end_date_override} placeholder="Present"
                   onChange={ev=>editExp(i,{end_date_override:ev.target.value})}/>
          </div>
        </div>

        <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid var(--line)"}}>
          {mine.map(({r,ri})=>
            <div key={ri} style={{...box, marginBottom:7}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <b style={{fontSize:12.5}}>{r.title_override||r._name}</b>
                {r.is_primary && <span className="chip info">Primary</span>}
                {r._composed && <span className="chip info">Composed</span>}
                <span style={{marginLeft:"auto",display:"flex",gap:4}}>
                  <button className="btn sec sm" title="Move up"   onClick={()=>move(ri,-1)}>&uarr;</button>
                  <button className="btn sec sm" title="Move down" onClick={()=>move(ri, 1)}>&darr;</button>
                  {!r.is_primary &&
                    <button className="btn sec sm" onClick={()=>primary(ri)}>Make primary</button>}
                  <button className="btn sec sm" onClick={()=>drop(ri)}>Remove</button>
                </span>
              </div>
              <div style={half}>
                <div>
                  <label>Title on this resume</label>
                  <input value={r.title_override} placeholder={r._name}
                         onChange={ev=>editRow(ri,{title_override:ev.target.value})}/>
                </div>
                <div>
                  <label>Employer</label>
                  <select value={r.company_id||""}
                          onChange={ev=>editRow(ri,{company_id:ev.target.value||null})}>
                    <option value="">&mdash; unassigned &mdash;</option>
                    {exp.map(o=><option key={o.company_id} value={o.company_id}>{o._name}</option>)}
                  </select>
                </div>
              </div>
              <label>Technologies (comma separated)</label>
              <input value={csv(r.technologies_override)} placeholder="leave blank to use the recorded stack"
                     onChange={ev=>editRow(ri,{technologies_override:arr(ev.target.value)})}/>
              <label>Description</label>
              <textarea rows={2} value={r.description_override}
                        placeholder="leave blank to use the recorded description"
                        onChange={ev=>editRow(ri,{description_override:ev.target.value})}/>
            </div>)}

          {!mine.length &&
            <div className="subtle" style={{fontSize:12,marginBottom:7}}>
              No project here yet — this employer would print as a bare heading.
            </div>}

          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <select value="" style={{flex:1,minWidth:150}} disabled={pool.l}
                    onChange={ev=>addFromBank(ev.target.value, c.company_id)}>
              <option value="">
                {pool.l ? "Loading the project bank\u2026"
                        : free.length ? `Add a project here\u2026 (${free.length})`
                        : "Every bank project is already on this resume"}
              </option>
              {free.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
            </select>
            <button className="btn sec sm" onClick={()=>addComposed(c.company_id)}>Compose one here</button>
          </div>
        </div>
      </div>;
    })}

    {!exp.length && <div className="empty">No employers on this resume yet.</div>}

    {/* Projects filed against no employer. They still reach the page — the
        composer assigns one on the next rebuild — but they are shown apart so
        the gap is visible rather than silent. */}
    {(() => {
      const known = new Set(exp.map(c=>c.company_id));
      const orphans = rows.map((r,ri)=>({r,ri})).filter(x=>!known.has(x.r.company_id));
      if (!orphans.length) return null;
      return <div style={{...box, borderStyle:"dashed"}}>
        <b style={{fontSize:13}}>Not filed under an employer</b>
        <div className="subtle" style={{fontSize:12,margin:"4px 0 8px"}}>
          The composer will place these on the next rebuild, or choose now.
        </div>
        {orphans.map(({r,ri})=>
          <div key={ri} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
            <span style={{flex:1,minWidth:140}}>{r.title_override||r._name}</span>
            <select value="" onChange={ev=>editRow(ri,{company_id:ev.target.value||null})}>
              <option value="">Choose an employer&hellip;</option>
              {exp.map(o=><option key={o.company_id} value={o.company_id}>{o._name}</option>)}
            </select>
            <button className="btn sec sm" onClick={()=>drop(ri)}>Remove</button>
          </div>)}
      </div>;
    })()}

    <div style={{display:"flex",gap:6,margin:"10px 0 4px",flexWrap:"wrap"}}>
      <select value="" style={{flex:1,minWidth:180}}
              onChange={ev=>addExperience(ev.target.value)}>
        <option value="">Add an employer from the bank&hellip;</option>
        {freeCo.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
    </div>

    {!freeCo.length && !!list(companies.d).length &&
      <div className="subtle" style={{fontSize:12}}>Every company in the bank is already on this resume.</div>}

    <div style={{display:"flex",gap:7,marginTop:12,alignItems:"center",flexWrap:"wrap"}}>
      <Btn busy={busy==="rebuild"} onClick={()=>save(true)}>Save &amp; rebuild resume</Btn>
      <Btn busy={busy==="save"} className="btn sec" onClick={()=>save(false)}>Save only</Btn>
      {dirty && <span className="subtle">Unsaved changes</span>}
    </div>

    <div className="subtle" style={{marginTop:12}}>
      Technologies on this resume: {(session?.selected_technology_names||[]).join(", ")||"—"}
    </div>
  </>;
}

/* ═════════════════════ 3. KNOWLEDGE BASE (§10–§16, §26, §34) ═════════════════════

   Every entity below lists the exact fields its specification section names, so
   the create/edit form is the spec rather than a convenient subset.
   Field types: text | num | date | area | list | select | ref                    */

const ENTITIES = {

    // breakdown is the whole answer, and it lives one click away under Details.
    // A person is an identity, nothing more. No stored role, no career total,
    // no education: every resume is composed for its JD out of the shared bank,

    cols: ["full_name", "email", "phone"],
    fields: [

      ["email", "Email", "text"], ["phone", "Phone", "text"],
    ],
  },

      ["sub_category", "Sub-category", "text"], ["aliases", "Aliases", "list"],

    ],

    fields: [
      ["name", "Project name", "text", true],

      ["short_description", "Short description", "area"],
      ["detailed_description", "Detailed description", "area"],
      ["responsibilities", "Responsibilities", "list"],

    ],
  },
  company: {

    fields: [
      ["name", "Company name", "text", true],
      ["role", "Role", "text"],
    ],
  },
  vendors: {
    label: "Vendors", path: "/vendors", key: "name",
    cols: ["name", "contact_person", "contact_email", "contact_phone", "is_active"],
    fields: [
      ["name", "Vendor name", "text", true], ["contact_person", "Contact person", "text"],
      ["contact_email", "Contact email", "text"], ["contact_phone", "Contact phone", "text"],
      ["notes", "Notes", "area"],
    ],
  },
  ptypes: {
    label: "Profile types", path: "/profile-types", key: "name",
    cols: ["name"], noEdit: true,
    fields: [["name", "Profile type", "text", true]],
  },
  jds: {

    cols: ["reference_code", "vendor_name", "template_name", "parsed_role",

  },

    cols: ["name", "code", "source_format", "is_fillable", "section_titles", "description"],
    custom: "templates",
  },
};

const EMPTY = f => Object.fromEntries(f.map(([n, , t]) => [n, t === "list" ? [] : ""]));

/* one form control, driven by the field type */
function Field({ def, value, onChange }) {
  const [name, label, type, req] = def;
  const common = { value: value ?? "", onChange: e => onChange(name, e.target.value) };

  if (type === "area")
    return <div className="grow"><label>{label}{req && " *"}</label>
      <textarea style={{ minHeight: 70 }} {...common} /></div>;

  if (type === "list")
    return <div className="grow"><label>{label} <span className="subtle">(one per line)</span></label>
      <textarea style={{ minHeight: 60 }}
        value={Array.isArray(value) ? value.join("\n") : (value || "")}
        onChange={e => onChange(name, e.target.value.split("\n").map(x => x.trim()).filter(Boolean))} />
    </div>;

  if (type?.startsWith("ref:")) {
    const [, path, lbl] = type.split(":");
    return <div className="grow"><label>{label}{req && " *"}</label>
      <RefSelect path={path} labelField={lbl} value={value} onChange={v => onChange(name, v)} /></div>;
  }

  return <div className="grow" style={{ maxWidth: 260 }}>
    <label>{label}{req && " *"}</label>
    <input type={type === "num" ? "number" : type === "date" ? "date" : "text"}
      step={type === "num" ? "any" : undefined} {...common} />
  </div>;
}

function RefSelect({ path, labelField, value, onChange }) {
  const { d } = useAsync(() => api(path, { params: { limit: 200 } }).then(list), [path]);
  return <select value={value || ""} onChange={e => onChange(e.target.value)}>
    <option value="">Select…</option>
    {list(d).map(o => <option key={o.id} value={o.id}>{o[labelField]}</option>)}
  </select>;
}

/* create / edit modal */
function EntityForm({ ent, row, onDone, onCancel }) {
  const [v, setV] = useState(() => ({ ...EMPTY(ent.fields), ...(row || {}) }));
  const [e, setE] = useState(null), [b, setB] = useState(false);
  const set = (k, x) => setV(o => ({ ...o, [k]: x }));

  const save = async () => {
    setB(true); setE(null);
    const body = {};
    for (const [n, , t, req] of ent.fields) {
      const x = v[n];
      if (t === "list") { if (x?.length) body[n] = x; continue; }
      if (x === "" || x == null) { if (req) { setE(`${n} is required`); setB(false); return; } continue; }
      body[n] = t === "num" ? Number(x) : x;
    }
    try {
      if (row?.id) await api(`${ent.path}/${row.id}`, { method: "PATCH", body });
      else await api(ent.path, { method: "POST", body });
      onDone();
    } catch (x) { setE(x.message); } finally { setB(false); }
  };

  return <div className="modal-bg" onClick={ev => ev.target === ev.currentTarget && onCancel()}>
    <div className="modal">
      <h3>{row ? "Edit" : "New"} · {ent.label}</h3>
      <Err e={e} />
      <div className="row">{ent.fields.map(f =>
        <Field key={f[0]} def={f} value={v[f[0]]} onChange={set} />)}</div>
      <div className="modal-bar">
        <Btn busy={b} onClick={save}>{row ? "Save changes" : "Create"}</Btn>
        <button className="btn sec" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  </div>;
}

/* §26 — upload a .docx / .tex / .pdf template */
function TemplateUpload({ onDone, onCancel }) {
  const [name, setName] = useState(""), [code, setCode] = useState("");
  const [desc, setDesc] = useState(""), [files, setFiles] = useState([]);
  const file = files[0] || null;
  const [e, setE] = useState(null), [b, setB] = useState(false);
  const [secs, setSecs] = useState(0);
  const ref = useAsync(() => api("/resume-templates/placeholders/reference"), []);

  // A .tex is registered in milliseconds. A .pdf or .docx has to be read,
  // rebuilt as LaTeX by the model, and then compiled to prove it works — which
  // takes minutes, not seconds. A bare spinner for that long reads as "hung",
  // so the wait is named up front and counted while it runs.
  const converts = !!file;

  const go = async () => {
    if (!files.length) { setE("Choose the template's .tex (with any .cls/.sty it needs), a .zip of the project, or a .pdf/.docx design."); return; }
    setB(true); setE(null); setSecs(0);
    const tick = setInterval(() => setSecs(n => n + 1), 1000);
    const fd = new FormData();
    fd.append("name", name); fd.append("code", code);
    if (desc) fd.append("description", desc);
    files.forEach(f => fd.append("files", f));
    try {
      const r = await fetch("/api/v1/resume-templates/upload",
        { method: "POST", headers: { Authorization: `Bearer ${TOKEN}` }, body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d?.error?.message || d?.detail || `HTTP ${r.status}`);
      onDone();
    } catch (x) { setE(String(x.message || x)); }
    finally { clearInterval(tick); setB(false); }
  };

  return <div className="modal-bg" onClick={ev => ev.target === ev.currentTarget && onCancel()}>
    <div className="modal">
      <h3>Upload resume template</h3>
      <Err e={e} />
      <div className="row">
        <div className="grow"><label>Template name *</label>
          <input value={name} onChange={e => setName(e.target.value)} /></div>
        <div className="grow"><label>Code *</label>
          <input value={code} onChange={e => setCode(e.target.value)} placeholder="GENAI_ACME_01" /></div>
      </div>
      <div className="row"><div className="grow"><label>Description</label>
        <input value={desc} onChange={e => setDesc(e.target.value)} /></div></div>
      <div className="row"><div className="grow">
        <label>Files — the whole template project</label>
        <input type="file" multiple
          accept=".tex,.cls,.sty,.zip,.docx,.pdf,.bib,.png,.jpg,.jpeg,.eps,.ttf,.otf"
          onChange={e => setFiles(Array.from(e.target.files || []))} />
        {files.length > 1 &&
          <div className="subtle" style={{ fontSize: 12, marginTop: 4 }}>
            {files.length} files — the main .tex is detected by its \documentclass line.
          </div>}
      </div></div>

      <div className="fmt-note">
        <b>How each format is used</b>
        <div><b>.tex</b> — used directly. Its preamble is copied exactly on every
          render, so the design cannot drift; only the body is rewritten with the
          candidate's history, angled at the JD.</div>
        <div><b>.pdf / .docx</b> — read as a <i>design</i> and converted to LaTeX once,
          now. A PDF has no reflowable structure, so it cannot be filled directly —
          the conversion rebuilds the layout, typography and spacing so it survives a
          candidate with longer text or more projects. Takes a few seconds, and the
          upload is rejected if the result does not compile.</div>
        <div><b>A whole project</b> — select the main .tex together with its .cls,
          .sty and image files, or upload the .zip Overleaf gives you. They are kept
          and compiled together, so what you saw on Overleaf is what this prints.</div>
        <div>At upload, the design&rsquo;s <b>sections are read</b> — its own headings, in
          its own order — and become this template&rsquo;s content window; and the design
          is converted once into a fillable template, verified by compiling a full
          sample resume through it. After that every resume in this design is a
          fill-in, not a rewrite: same content, same PDF, every time.</div>
      </div>



      {b && converts &&
        <div className="fmt-note" style={{ borderColor: "var(--warn)" }}>
          <b>Rebuilding the design as LaTeX — {secs}s elapsed</b>
          <div>
            This normally takes one to three minutes: the model reads the layout,
            writes a self-contained template, and the result is compiled to prove
            it works before the upload is accepted. Leave this open.
          </div>
        </div>}

      <div className="modal-bar">
        <Btn busy={b} onClick={go}>
          {b && converts ? `Converting… ${secs}s` : "Upload template"}
        </Btn>
        <button className="btn sec" onClick={onCancel} disabled={b}>Cancel</button>
      </div>
    </div>
  </div>;
}

/* §5 · §32 — the stored JD, correctable.

   Not driven by the generic EntityForm: the parsed fields are not top-level
   columns on the update payload, they travel as one `parsed` block, which is
   the channel section 5 defines for "the parsed information can be corrected
   before continuing". Editing them here is that correction. */
function JdEditor({ row, onDone, onCancel }) {
  const [jd, setJd] = useState(row.raw_jd_text || "");
  const [tpl, setTpl] = useState(row.template_id || "");
  const [status, setStatus] = useState(row.status || "OPEN");
  const [p, setP] = useState({
    role: row.parsed_role || "",
    min_experience_years: row.min_experience_years ?? "",
    max_experience_years: row.max_experience_years ?? "",
    location: row.location || "",
    domain: row.domain || "",
    responsibilities: row.responsibilities || [],
    other_requirements: row.other_requirements || [],
