<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoleFit — JD-Driven Resume Platform</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%231B9E58%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2745%27%20font-family%3D%27sans-serif%27%20font-size%3D%2734%27%20font-weight%3D%27800%27%20fill%3D%27%23ffffff%27%20text-anchor%3D%27middle%27%20letter-spacing%3D%27-2%27%3ERF%3C%2Ftext%3E%3C%2Fsvg%3E">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4FAF6;
  --panel:#ffffff;
  --soft:#F3F9F5;
  --sel:#E4F3EA;
  --nav:#123328;
  --panel2:#EAF4EE;
  --panel-hover:#F1F8F4;
  --ink:#12241C;
  --ink2:#2C4638;
  --muted:#658071;
  --line:#DAE8DF;
  --line2:#B7D0C1;
  
  --accent:#1B9E58;
  --accent2:#137F46;
  --accent-soft:#E7F6EE;
  --accent-gradient:linear-gradient(135deg, #22A961 0%, #127F49 100%);
  
  --ok:#0EA47A;
  --ok-dark:#0B7A5B;
  --ok-soft:#E6F7F1;
  --ok-border:#A7E5D0;
  
  --warn:#d97706;
  --warn-dark:#b45309;
  --warn-soft:#fffbeb;
  --warn-border:#fde68a;
  
  --crit:#e11d48;
  --crit-dark:#be123c;
  --crit-soft:#fff1f2;
  --crit-border:#fecdd3;
  
  --info:#2563eb;
  --info-dark:#1d4ed8;
  --info-soft:#eff6ff;
  --info-border:#bfdbfe;

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  
  --shadow-sm:0 1px 3px 0 rgba(16, 40, 30, 0.05);
  --shadow-md:0 4px 14px -2px rgba(16, 40, 30, 0.09), 0 2px 4px -2px rgba(16, 40, 30, 0.05);
  --shadow-lg:0 20px 30px -10px rgba(16, 40, 30, 0.16), 0 10px 15px -5px rgba(16, 40, 30, 0.08);
  
  --transition:all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

*{box-sizing:border-box}
html,body,#root{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.6 'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',Consolas,monospace;font-size:0.9em}

/* layout */
.app{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.top{
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--nav);
  color:#F2FAF5;
  padding:0 22px;
  height:56px;
  flex:0 0 auto;
  border-bottom:1px solid rgba(255,255,255,0.08);
  box-shadow:0 4px 12px rgba(16, 40, 30, 0.18);
}
.brand{
  font-weight:800;
  font-size:16px;
  letter-spacing:-0.02em;
  display:flex;
  align-items:center;
  gap:8px;
  color:#ffffff;
  /* The one label that must never break mid-word — everything to its right
     yields space first (tabs scroll, the badge hides) before this wraps. */
  white-space:nowrap;
  flex:0 0 auto;
}
.brand .mark{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;height:26px;
  border-radius:8px;
  background:var(--accent-gradient);
  color:#fff;
  font-size:11px;
  font-weight:800;
  letter-spacing:-0.02em;
  box-shadow:0 3px 8px -2px rgba(0,0,0,0.35);
}
.brand small{
  background:rgba(52,199,123,0.18);
  color:#7FE0AC;
  border:1px solid rgba(52,199,123,0.32);
  font-size:10.5px;
  padding:2px 8px;
  border-radius:20px;
  text-transform:uppercase;
  font-weight:700;
  margin-left:6px;
  letter-spacing:0.05em;
  white-space:nowrap;
}
.tabs{
  display:flex;
  gap:4px;
  margin-left:auto;
  background:rgba(255,255,255,0.05);
  padding:4px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.08);
  /* The one group with room to give: on a narrow window this scrolls
     sideways instead of wrapping the bar onto a second line or squeezing
     every label into a wrapped mess. */
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tabs button{
  background:transparent;
  border:0;
  color:#9DBCAB;
  padding:7px 14px;
  border-radius:6px;
  font-weight:600;
  font-size:13px;
  white-space:nowrap;
  flex:0 0 auto;
  transition:var(--transition);
}
.tabs button:hover:not(:disabled){
  color:#F2FAF5;
  background:rgba(255,255,255,0.10);
}
.tabs button.on{
  background:var(--accent-gradient);
  color:#ffffff;
  box-shadow:0 2px 10px rgba(18,127,73,0.45);
  font-weight:700;
}
.tabs button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}
.who{
  display:flex;
  align-items:center;
  color:#BCD6C7;
  font-size:12.5px;
  font-weight:500;
  white-space:nowrap;
  flex:0 0 auto;
}
.who button{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  color:#DDEEE4;
  border-radius:6px;
  padding:4px 11px;
  margin-left:12px;
  font-size:12px;
  font-weight:600;
  transition:var(--transition);
}
.who button:hover{
  background:rgba(239,68,68,0.2);
  border-color:rgba(239,68,68,0.4);
  color:#fca5a5;
}
/* Below this, the email address is the least useful thing on the bar to keep
   showing — the tabs and the sign-out control matter more when space is
   tight, so it goes first. */
@media (max-width: 860px){
  .who .email{display:none}
}
@media (max-width: 640px){
  .brand small{display:none}
}
main{flex:1;min-height:0;overflow:auto;padding:22px;max-width:1440px;width:100%;margin:0 auto}
main.nopad{padding:0;overflow:hidden;max-width:none}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow-sm);
  transition:var(--transition);
}
.card:hover{
  box-shadow:var(--shadow-md);
  border-color:var(--line2);
}
.card h3{
  margin:0 0 14px;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--accent);
}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grow{flex:1;min-width:220px}
label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--ink2);
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:#ffffff;
  color:var(--ink);
  font-size:13.5px;
  transition:var(--transition);
}
textarea{
  min-height:140px;
  resize:vertical;
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  line-height:1.6;
  padding:12px;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(27,158,88,0.18);
}

.btn{
  background:var(--accent-gradient);
  color:#ffffff;
  border:0;
  border-radius:var(--radius-sm);
  padding:9px 18px;
  font-weight:600;
  font-size:13.5px;
  transition:var(--transition);
  box-shadow:0 2px 6px rgba(18,127,73,0.28);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(18,127,73,0.38);
  filter:brightness(1.05);
}
.btn:active:not(:disabled){
  transform:translateY(0);
}
.btn:disabled{
  opacity:0.45;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}
.btn.sec{
  background:#ffffff;
  color:var(--ink2);
  border:1px solid var(--line2);
  box-shadow:var(--shadow-sm);
}
.btn.sec:hover:not(:disabled){
  background:var(--panel2);
  border-color:#8FBBA1;
  color:var(--ink);
  transform:translateY(-1px);
}
.btn.sm{
  padding:6px 12px;
  font-size:12px;
  border-radius:5px;
}
.btn.ok{
  background:linear-gradient(135deg, #10b981 0%, #059669 100%);
  color:#fff;
  box-shadow:0 2px 6px rgba(16,185,129,0.25);
}
.btn.ok:hover:not(:disabled){
  box-shadow:0 4px 12px rgba(16,185,129,0.35);
}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--muted);
  padding:12px 14px;
  background:var(--soft);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
  position:sticky;
  top:0;
  z-index:2;
}
td{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
  transition:var(--transition);
  color:var(--ink);
}
tbody tr{transition:background 0.15s ease}
tbody tr:hover{background:#EDF7F1}
tr.sel{background:var(--sel) !important;position:relative}
tr.sel td:first-child{border-left:3px solid var(--accent)}
.scroll{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:#ffffff;
  box-shadow:var(--shadow-sm);
}

.genprogress{
  margin-top:10px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm,6px);
  background:var(--soft);
}
.gp-row{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  padding:2px 0;
  color:#8a8a8a;
}
.gp-row.done{ color:var(--ok-dark); }
.gp-row.on{ color:var(--ink); font-weight:600; }
.gp-dot{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:14px;
  height:14px;
  border-radius:50%;
  border:1.5px solid currentColor;
  font-size:10px;
  flex:none;
}
.gp-row.on .gp-dot{
  border-color:var(--accent);
  color:var(--accent);
  animation:gp-pulse 1s ease-in-out infinite;
}
@keyframes gp-pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

.chip{
  display:inline-flex;
  align-items:center;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:3px 9px;
  border-radius:20px;
  white-space:nowrap;
  border:1px solid transparent;
  transition:var(--transition);
}
.chip.AVAILABLE,.chip.KEPT,.chip.APPROVED,.chip.ok{background:var(--ok-soft);color:var(--ok-dark);border-color:var(--ok-border)}
.chip.RESERVED,.chip.WARNING,.chip.warn,.chip.GENERATED,.chip.EDITING{background:var(--warn-soft);color:var(--warn-dark);border-color:var(--warn-border)}
.chip.ENGAGED,.chip.SUBMITTED,.chip.INFO,.chip.info{background:var(--info-soft);color:var(--info-dark);border-color:var(--info-border)}
.chip.ENGAGED{background:linear-gradient(135deg, #2563eb, #1d4ed8);color:#ffffff;border-color:#1e40af;box-shadow:0 2px 4px rgba(37,99,235,0.2)}
.chip.REJECTED,.chip.CRITICAL,.chip.crit,.chip.ABANDONED{background:var(--crit-soft);color:var(--crit-dark);border-color:var(--crit-border)}
.chip.RELEASED,.chip.OPEN,.chip.DISMISSED,.chip.na,.chip.SUPERSEDED,.chip.DRAFT,.chip.MANDATORY{background:#EEF4F0;color:#4A6357;border-color:#C9DCD1}
.chip.PREFERRED{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
.chip.TEX,.chip.LATEX{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe}
.chip.DOCX{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.chip.PDF{background:#fff1f2;color:#be123c;border-color:#fecdd3}

.steps{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:20px;
  background:var(--panel);
  padding:12px 18px;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  flex-wrap:wrap;
}
.steps div{
  font-size:13px;
  padding:6px 14px;
  border-radius:20px;
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--muted);
  font-weight:500;
  transition:var(--transition);
  display:flex;
  align-items:center;
  gap:6px;
}
.steps div.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700;box-shadow:0 0 0 3px rgba(27,158,88,0.12)}
.steps div.done{background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok-dark);font-weight:600}
.steps span{color:var(--line2);font-weight:700;font-size:14px}

/* studio */
.studio{display:flex;height:100%;min-height:0;background:var(--bg)}
.left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--soft)}
.pvhead{
  display:flex;
  align-items:center;
  gap:12px;
  row-gap:8px;
  padding:10px 18px;
  background:#ffffff;
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  z-index:5;
  /* Six things share this row — a label, a metadata line, two status chips
     and a cluster of buttons — and no window width guarantees all of them
     fit on one line. Wrapping keeps each piece intact (see the no-wrap +
     ellipsis rules below) instead of letting the text break mid-word and
     the buttons drift over whatever sits next to them. */
  flex-wrap:wrap;
}
.pvhead b{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.pvhead > .subtle{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:60px;
  flex:0 1 auto;
}
.pvhead .chip{flex:0 0 auto;white-space:nowrap}
.pvhead .actions{
  display:flex;
  gap:4px;
  align-items:center;
  margin-left:auto;
  flex:0 0 auto;
}
iframe{flex:1;width:100%;border:0;background:#fff}
.right{width:min(46%,620px);display:flex;flex-direction:column;background:#ffffff;min-width:360px;border-left:1px solid var(--line);box-shadow:-4px 0 16px rgba(16,40,30,0.04)}
.rtabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--soft);padding:0 8px}
.rtabs button{
  flex:1;
  min-width:0;
  background:transparent;
  border:0;
  padding:12px 6px;
  font-size:12.5px;
  font-weight:600;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  border-bottom:2px solid transparent;
  transition:var(--transition);
}
.rtabs button:hover{color:var(--ink);background:rgba(0,0,0,0.02)}
.rtabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:#ffffff;font-weight:700}
.rtabs .badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--crit);
  color:#fff;
  border-radius:10px;
  font-size:10px;
  font-weight:700;
  height:18px;
  min-width:18px;
  padding:0 6px;
  margin-left:6px;
}
.rbody{flex:1;overflow:auto;padding:16px}
.bar{flex:0 0 auto;display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:var(--soft);flex-wrap:wrap;align-items:center}

.msg{margin-bottom:14px;animation:fadeIn 0.2s ease-out}
.msg .b{padding:12px 16px;border-radius:12px;display:inline-block;max-width:88%;font-size:13.5px;line-height:1.55;box-shadow:var(--shadow-sm);white-space:pre-wrap}
.msg.u{text-align:right}
.msg.u .b{background:var(--accent-gradient);color:#ffffff;border-bottom-right-radius:3px}
.msg.a .b{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:3px}
.tools{font-size:11px;color:var(--muted);margin-top:5px}
.tools code{background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px;margin-right:4px;font-family:'JetBrains Mono',monospace}
.chatbox{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#ffffff}
.chatbox textarea{min-height:48px;height:48px;border-radius:var(--radius-sm);border-color:var(--line2);padding:10px 12px;font-size:13.5px}
.hint{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.7;background:var(--soft);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.hint b{color:var(--accent);cursor:pointer;border-bottom:1px solid var(--accent-soft);transition:var(--transition)}
.hint b:hover{color:var(--accent2);border-bottom-color:var(--accent)}

.warn-item{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;background:#fff;box-shadow:var(--shadow-sm);transition:var(--transition)}
.warn-item.CRITICAL{border-left-color:var(--crit)}
.warn-item.INFO{border-left-color:var(--info)}
.warn-item p{margin:6px 0;font-size:13px;color:var(--ink2)}
.warn-item .claim{font-size:12px;background:var(--soft);padding:8px 12px;border-radius:4px;color:var(--ink2);border:1px solid var(--line);margin-top:6px;font-style:italic}

.err{background:var(--crit-soft);color:var(--crit-dark);border:1px solid var(--crit-border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;font-size:13px;white-space:pre-wrap;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:36px 14px;font-size:13.5px;font-weight:500}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
::selection{background:var(--accent-soft);color:var(--accent2)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#CBE0D3;border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#A9CEB8;background-clip:content-box}
/* Keyboard focus only — a mouse click on a button should not leave a ring
   behind it, which is why this is :focus-visible and not :focus. */
.btn:focus-visible,.linky:focus-visible,.tabs button:focus-visible,.rtabs button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(0.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg, #E9F6EF 0%, #F7FCF9 52%, #E7F5EE 100%);
  padding:28px;
}
.login-card{
  display:flex;
  width:min(940px,100%);
  background:#ffffff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 30px 60px -24px rgba(16,50,36,0.28);
  overflow:hidden;
  animation:popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ── left: illustration panel. Pure SVG, no image asset to keep in sync ── */
.login-art{
  flex:1 1 46%;
  background:linear-gradient(180deg, #EDF8F2 0%, #DDF1E6 100%);
  padding:48px 40px;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.login-art svg{width:100%;max-width:290px;height:auto}
.login-art h3{margin:30px 0 8px;font-size:21px;font-weight:800;letter-spacing:-0.02em;color:var(--ink)}
.login-art p{margin:0;font-size:13px;color:var(--ink2);opacity:0.75;line-height:1.65;max-width:280px}

/* ── right: the form ── */
.login-form{
  flex:1 1 54%;
  min-width:0;
  padding:54px 52px;
  display:flex;
  flex-direction:column;
  justify-content:center;

/* ═══════════════════ dashboard ═══════════════════════════════════════

   The charts here are CSS, not SVG and not a library. Every one of them is a
   bar — stacked, grouped or paired — and a bar is a div with a width or a
   height. Pulling in a charting CDN to draw those would add a script tag, a
   viewBox and a resize observer to a frontend whose whole point is that it is
   one file with no build step.

   The nine series colours below are the dashboard's palette. They exist as
   variables rather than inline styles so the stacked bar, its legend and the
   chip in the table beside it cannot drift into describing SUBMITTED with two
   different blues. They line up with the .chip rules above, with one
   deliberate difference: EDITING and RESERVED share a chip colour and must not
   share a bar segment colour, or the two halves of a hold become one block. */
:root{
  --s-AVAILABLE:#0EA47A;
  --s-EDITING:#f59e0b;
  --s-RESERVED:#d97706;
  --s-SUBMITTED:#7dabf8;
  --s-ENGAGED:#2563eb;
  --s-RELEASED:#94a3b8;
  --s-REJECTED:#e11d48;
  --s-demand:#2563eb;
  --s-supply:#0EA47A;
}

.dash{display:flex;flex-direction:column;gap:14px}

/* A panel with the row to itself. The bars inside are read by comparing two
   lengths against each other, and past a point a longer bar is harder to
   compare rather than easier, so the chart is capped instead of stretched. */

/* vertical bars — a day, a week, a month. One series draws a plain bar chart,
   several draw a grouped one; the markup is the same either way. */
.vbars{display:flex;align-items:stretch;gap:6px;height:124px;margin:14px 0 0}

/* The track is always full width and the fill is proportional to the row's
