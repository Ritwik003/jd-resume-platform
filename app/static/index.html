    setBusy(true); setE(null); setGenSessionId(null);
    try {
      await commitMissingTechs(requirement.id, newTechs);
      const res = await api("/reservations",{method:"POST",body:{
        person_id:pick.person_id, vendor_id:requirement.vendor_id, requirement_id:requirement.id}});
      const s = await api("/resume-sessions",{method:"POST",body:{
        requirement_id:requirement.id, person_id:pick.person_id,
        // Omitted when unset, in which case the session inherits the JD's.
        template_id: tpl || undefined, reservation_id:res.id}});
      setGenSessionId(s.id);
      const gen = await api(`/resume-sessions/${s.id}/generate`,
                            {method:"POST", body:{options: shape}});
      GENERATION_NOTES[s.id] = gen.ground_rules || [];
      onStudio(s.id);
    } catch (x) { setE(x.message); } finally { setBusy(false); setGenSessionId(null); }
  };

  return <div className="modal-bg" onClick={ev=>ev.target===ev.currentTarget && onCancel()}>
    <div className="modal" style={{maxWidth:640}}>
      <h3>New resume · {requirement.reference_code}</h3>
      <Err e={e}/>
      <Err e={rows.e}/>
      <div className="scroll" style={{maxHeight:340}}>
        <table>
          <thead><tr><th>Profile</th><th>Current engagement</th><th>Vendor status</th><th>Availability</th></tr></thead>
          <tbody>
            {rows.l && <tr><td colSpan="4" className="empty">Loading…</td></tr>}
            {!rows.l && (rows.d||[]).map(row =>
              <tr key={row.person_id}
                  className={pick?.person_id===row.person_id?"sel":""}
                  style={{cursor:row.is_selectable?"pointer":"not-allowed",opacity:row.is_selectable?1:.5}}
                  onClick={()=>row.is_selectable && setPick(row)}>
                <td><b>{row.person_name}</b></td>
                <td className="subtle">{row.current_engagement_label||"—"}</td>
                <td><Chip v={row.vendor_status}/></td>
                <td>{row.is_selectable
                      ? <span className="chip ok">Available</span>
                      : <span className="chip na">Not available</span>}</td>
              </tr>)}
            {!rows.l && !(rows.d||[]).length &&
              <tr><td colSpan="4" className="empty">No profiles returned for this vendor.</td></tr>}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:12, paddingTop:10, borderTop:"1px solid var(--line)"}}>
        <label style={{fontWeight:600}}>Design for this resume</label>
        <select value={tpl} onChange={ev=>setTpl(ev.target.value)} style={{maxWidth:340}}>
          {list(templates.d).map(t=>
            <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <div className="subtle" style={{fontSize:12, marginTop:4}}>
          {(() => {
            const chosen = list(templates.d).find(t => t.id === tpl);
            if (!chosen) return "Loading the designs…";
            const carried = tpl && requirement.template_id && tpl !== requirement.template_id;
            return <>
              {chosen.description}
              {carried
                ? <div style={{marginTop:3}}>
                    Different from this JD&rsquo;s default — only this resume changes.
                  </div>
                : null}
            </>;
          })()}
        </div>
      </div>
      <div style={{marginTop:12, paddingTop:10, borderTop:"1px solid var(--line)"}}>
        <label style={{fontWeight:600}}>Shape of the resume</label>
        <ShapeForm value={shape} onChange={setShape}/>
      </div>
      <MissingTechs requirementId={requirement.id} value={newTechs} onChange={setNewTechs}/>
      <GenerationChecklist progress={genProgress}/>
      <div className="modal-bar">
        <button className="btn sec" onClick={onCancel}>Cancel</button>
        <Btn busy={busy}
             disabled={!pick || newTechs.some(x=>!x.release_year)}
             onClick={start}>
          {pick ? `Reserve ${pick.person_name} & generate resume` : "Select a profile above"}
        </Btn>
      </div>
    </div>
  </div>;
}

/* ═══════════════════ §31 RESERVATIONS ═══════════════════════════════

   Every profile currently RESERVED, across every vendor: an approved resume
   somebody has to make a call on, with a clock running. Vendor tracking shows
   the whole lifecycle for one vendor at a time; this is the one cross-vendor
   worklist for the single state that has a deadline and a decision pending —
   the thing an operator opens the app each morning to clear.

   Once a row is set to SUBMITTED, ENGAGED or REJECTED it simply stops being
   RESERVED, so it drops out of this list on its own — no separate rule
   needed, the filter on the status IS the rule. RELEASED is not offered here:
   it only ever follows ENGAGED (see MANUAL_NEXT_STATUSES), so a profile has
   to be engaged first — from this same picker — before it can be released
   from the Vendor tracking view. There is no manual shortcut back to
   AVAILABLE either; an unattended hold lapses there on its own.

   The other way out is Open, which takes the resume back into the studio. A
   hold is an answer nobody has given yet, not a finished piece of work, so the
   composition stays ours to change until somebody decides: Open returns the
   session to EDITING, approving it again returns it here, and that loop runs
   as often as the work needs it to. */

function ReservationsBoard({ onOpenStudio }) {
  const rows = useAsync(() => api("/vendor-tracking/profiles"), []);
  const [busy, setBusy] = useState("");
  const [err, setErr]   = useState(null);
  const [extendMinutes, setExtendMinutes] = useState({});
  const [page, setPage] = useState(1);
  const TABLE_PAGE = 20;

  const reopen = async (row) => {
    setBusy(row.person_id + row.vendor_id); setErr(null);
    try { await openForEditing(row.session_id, row.status, onOpenStudio); }
    catch (x) { setErr(x.message); setBusy(""); }
  };

  const reservedAll = (rows.d || []).filter(r => r.status === "RESERVED")
    .sort((a, b) => (a.hold_minutes_left ?? Infinity) - (b.hold_minutes_left ?? Infinity));
  const pageCount = Math.max(1, Math.ceil(reservedAll.length / TABLE_PAGE));
  // Clamped, not reset: advancing or extending a hold reloads this list and
  // can shrink it out from under the page you were on.
  const curPage = Math.min(page, pageCount);
  const reserved = reservedAll.slice((curPage - 1) * TABLE_PAGE, curPage * TABLE_PAGE);

  const advance = async (row, status) => {
    setBusy(row.person_id + row.vendor_id); setErr(null);
    try {
      await api(`/vendor-tracking/${row.vendor_id}/profiles/${row.person_id}/status`,
                { method: "POST", body: { status } });
      rows.reload();
    } catch (x) { setErr(x.message); } finally { setBusy(""); }
  };

  const extend = async (row, minutes) => {
    if (!(minutes > 0)) return;
    const key = row.person_id + row.vendor_id;
    setBusy(key); setErr(null);
    try {
      await api(`/vendor-tracking/${row.vendor_id}/profiles/${row.person_id}/extend`,
                { method: "POST", body: { additional_minutes: minutes } });
      rows.reload();
    } catch (x) { setErr(x.message); } finally { setBusy(""); }
  };

  return <div className="card">
    <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
      <h3 style={{ margin: 0 }}>Reservations — held, awaiting a decision</h3>
      <span className="subtle" style={{ fontSize: 12 }}>{reservedAll.length} held</span>
    </div>
    <Err e={err} />
    <Err e={rows.e} />
    {rows.l ? <div className="empty">Loading…</div> :
     !reservedAll.length ? <div className="empty">Nothing is reserved right now.</div> :
     <div className="scroll" style={{ marginTop: 10 }}>
       <table>
         <thead><tr>
           <th>Person</th><th>Vendor</th><th>Selected for</th><th>Resume</th>
           <th>Hold</th><th>Extend</th><th>Set status</th>
         </tr></thead>
         <tbody>{reserved.map(r => {
           const key = r.person_id + r.vendor_id;
           return <tr key={key}>
             <td><b>{r.person_name}</b></td>
             <td>{r.vendor_name}</td>
             <td>{r.role || <span className="subtle">—</span>}
               {r.requirement_code &&
                 <div className="subtle mono" style={{ fontSize: 11.5 }}>{r.requirement_code}</div>}
             </td>
             <td className="mono" style={{ fontSize: 12 }}>
               {r.submission_reference || r.session_reference || "—"}
               {r.version_no ? <span className="subtle"> · v{r.version_no}</span> : null}
               {r.session_id &&
                 <button className="btn sec sm" style={{ marginLeft: 6 }} disabled={busy === key}
                         onClick={() => reopen(r)}>Open</button>}
             </td>
             <td style={{ fontSize: 12 }} className={holdIsUrgent(r.hold_minutes_left) ? "" : "subtle"}>
               {holdIsUrgent(r.hold_minutes_left)
                 ? <b style={{ color: "var(--warn)" }}>{holdLeft(r.hold_minutes_left)}</b>
                 : (holdLeft(r.hold_minutes_left) || "—")}
             </td>
             <td>
               <span style={{ display: "flex", gap: 4, alignItems: "center" }}>
                 <input type="number" min="1" step="15" className="mono"
                        style={{ width: 64 }} disabled={busy === key}
                        value={extendMinutes[key] ?? 60}
                        onChange={ev => setExtendMinutes(m => ({ ...m, [key]: ev.target.value }))} />
                 <span className="subtle" style={{ fontSize: 11 }}>min</span>
                 <button className="btn sec sm" disabled={busy === key}
                         onClick={() => extend(r, Number(extendMinutes[key] ?? 60))}>Extend</button>
               </span>
             </td>
             <td>
               <select style={{ width: 140 }} value="" disabled={busy === key}
                       onChange={ev => ev.target.value && advance(r, ev.target.value)}>
                 <option value="">Set status…</option>
                 {nextStatuses(r.status).map(x => <option key={x} value={x}>{x}</option>)}
               </select>
             </td>
           </tr>;
         })}</tbody>
       </table>
     </div>}
    {!rows.l && !!reservedAll.length &&
      <Pager page={curPage} pageCount={pageCount} onPage={setPage} />}
    <div className="subtle" style={{ marginTop: 8 }}>
      A RESERVED hold is an approved resume waiting on a decision. Set it to <b>submitted</b>,
      {" "}<b>engaged</b> or <b>rejected</b> and it leaves this list for good — none of those states
      {" "}come back here for this vendor. To <b>release</b> somebody, engage them first — release
      {" "}only ever follows an engagement, from the Vendor tracking view. An unattended hold is never
      {" "}released manually; it simply lapses back to available on its own clock.
      {" "}Not finished with it? <b>Open</b> takes the resume back into the studio for editing, and
      {" "}approving it again brings it back here.
    </div>
  </div>;
}

/* ═══════════════════ DASHBOARD ══════════════════════════════════════

   The landing screen, and the only one here that is read-only from top to
   bottom. Every panel is a digest with a real screen behind it: the heading
   links there, the count beside the heading is the true total, and nothing on
   this page changes a row. That is deliberate — this is the screen somebody
   leaves open on a second monitor, and a screen that acts by being looked at
   is not one you can leave open.

   Six panels in the order they get read: what happened today, what has a
   clock on it, who we took on this month, and then three trends that only make
   sense across the whole pool. Everything comes from one request; see
   app/controllers/dashboard_controller.py for why. */

/* Refetched on a minute, because the hold countdowns are the point of the
   strip across the top and a stale one is worse than no number at all. The
   previous payload stays on screen while the next one is in flight — a
   dashboard that blanks to "Loading…" every sixty seconds is unreadable — and
   an overlapping tick is dropped rather than queued. */
function useDashboard(everyMs) {
  const [d, setD]       = useState(null);
  const [e, setE]       = useState(null);
  const [at, setAt]     = useState(null);
  const [busy, setBusy] = useState(false);
  const inflight = useRef(false);
  const alive    = useRef(true);

  const load = useCallback(async () => {
    if (inflight.current) return;
    inflight.current = true;
    setBusy(true);
    try {
      const next = await api("/dashboard/summary");
      if (!alive.current) return;
      setD(next); setE(null); setAt(new Date());
    } catch (x) {
      if (alive.current) setE(x.message);
    } finally {
      inflight.current = false;
      if (alive.current) setBusy(false);
    }
  }, []);

  useEffect(() => {
    alive.current = true;
    load();
    const id = everyMs ? setInterval(load, everyMs) : null;
    return () => { alive.current = false; if (id) clearInterval(id); };
  }, [load, everyMs]);

  return { d, e, at, busy, reload: load };
}

/* ─────────────────────────── chart primitives ───────────────────────

   Three of them, all CSS. See the .vbars / .hbar / .pair rules for why there
   is no charting library here. */

/* Vertical bars: one column per bucket. A `series` of length one draws a plain
   bar chart, longer draws a grouped one, and both share a single y-scale so
   the columns can actually be compared with each other. */
function VBars({ data, series }) {
  const max = Math.max(1, ...data.map(row => Math.max(...series.map(s => row[s.key] || 0))));
  return <div className="vbars">
    {data.map(row => {
      const total = series.reduce((n, s) => n + (row[s.key] || 0), 0);
      return <div key={row.key}
                  className={"vbar" + (total ? "" : " zero") + (row.now ? " now" : "")}
                  title={row.title}>
        <div className="val">{total || ""}</div>
        <div className="grp">
          {series.map(s => <i key={s.key}
                              style={{ height: `${((row[s.key] || 0) / max) * 100}%`,
                                       background: (row[s.key] || 0) ? s.color : "var(--line)" }}/>)}
        </div>
        <div className="cap">{row.label}</div>
      </div>;
    })}
  </div>;
}

/* Horizontal stacked bars: the length is the row total against the biggest
   row, the segments inside are that row's composition. */
function HStack({ rows, series, onRow }) {
  const max = Math.max(1, ...rows.map(r => r.total));
  return <div style={{ marginTop: 12 }}>
    {rows.map(r => <div className="hrow" key={r.key}>
      <div className="name" title={r.name}>
        {onRow
          ? <button className="linky" style={{ fontSize: "inherit" }} onClick={() => onRow(r)}>{r.name}</button>
          : r.name}
      </div>
      <div className="hbar">
        <div className="fill" style={{ width: `${(r.total / max) * 100}%` }}>
          {series.map(s => (r.counts[s.key] || 0) > 0
            ? <span key={s.key}
                    style={{ flex: r.counts[s.key], background: s.color }}
                    title={`${s.label}: ${r.counts[s.key]}`}/>
            : null)}
        </div>
      </div>
      <div className="tot">{r.total}</div>
    </div>)}
  </div>;
}

const Legend = ({ series }) => <div className="legend">
  {series.map(s => <span key={s.key}><i style={{ background: s.color }}/>{s.label}</span>)}
</div>;

/* ───────────────────────────── the series ───────────────────────────

   Named once and used by the chart and its legend together, so a colour can
   never mean one thing in a bar and another in the key beside it. */
const STATUS_SERIES = [
  { key: "AVAILABLE", label: "Available", color: "var(--s-AVAILABLE)" },
  { key: "EDITING",   label: "Editing",   color: "var(--s-EDITING)" },
  { key: "RESERVED",  label: "Reserved",  color: "var(--s-RESERVED)" },
  { key: "SUBMITTED", label: "Submitted", color: "var(--s-SUBMITTED)" },
  { key: "ENGAGED",   label: "Engaged",   color: "var(--s-ENGAGED)" },
  { key: "RELEASED",  label: "Released",  color: "var(--s-RELEASED)" },
  { key: "REJECTED",  label: "Rejected",  color: "var(--s-REJECTED)" },
];
const OUTCOME_SERIES = [
  { key: "submitted", label: "Sent",     color: "var(--s-SUBMITTED)" },
  { key: "engaged",   label: "Engaged",  color: "var(--s-ENGAGED)" },
  { key: "rejected",  label: "Rejected", color: "var(--s-REJECTED)" },
];

const clockAt = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
const dayOf   = iso => iso ? new Date(iso).toLocaleDateString([], { day: "numeric", month: "short" }) : "—";

/* ────────────────────────────── the screen ──────────────────────────── */
function Dashboard({ go }) {
  const { d, e, at, busy, reload } = useDashboard(60000);

  if (e && !d) return <div className="card"><h3>Dashboard</h3><Err e={e}/></div>;
  if (!d) return <div className="card"><div className="empty">Loading…</div></div>;

  const k   = d.kpis;
  const eng = d.engagements;
  const res = d.reservations;
  const nv  = d.new_vendors;

  const tile = (n, label, sub, tone, tab) =>
    <button key={label} className={"kpi" + (tone ? " " + tone : "")} onClick={() => go(tab)}>
      <div className="n">{n}</div>
      <div className="k">{label}</div>
      <div className="sub">{sub}</div>
    </button>;

  return <div className="dash">

    {/* ── the strip: five counts and a deadline ───────────────────── */}
    <div className="kpis">
      {tile(k.open_jds, "Open JDs", "raised, not closed", null, "jd")}
      {tile(k.live_holds, "Live holds", "editing or reserved", null, "res")}
      {tile(k.expiring_soon, "Expiring soon",
            `within ${Math.round(k.expiring_within_minutes / 60)}h`,
            k.expiring_soon ? "urgent" : null, "res")}
      {tile(k.out_with_vendors, "With vendors", "awaiting an answer", null, "vend")}
      {tile(k.engaged, "Engaged", "running now", k.engaged ? "good" : null, "vend")}
      {tile(k.engaged_today, "Engaged today",
            k.engaged_today ? "new today" : "none yet today",
            k.engaged_today ? "good" : null, "vend")}
    </div>

    {/* ── 1 · engaged today, with the fortnight behind it ──────────── */}
    <div className="card">
      <h3>
        Engagements
        <span className="subtle">
          {eng.today.length} today · {eng.earlier_total} still running
        </span>
        <span style={{ marginLeft: "auto", display: "flex", gap: 10, alignItems: "baseline" }}>
          {at && <span className="subtle" style={{ fontSize: 11.5 }}>
            updated {clockAt(at.toISOString())}{busy ? " · refreshing" : ""}
          </span>}
          <button className="btn sec sm" onClick={reload} disabled={busy}>Refresh</button>
        </span>
      </h3>

      {/* The bars count engagement *events* from the audit trail, so one that
          has since been released still shows on the day it happened. The list
          below counts live pairs. Two different questions, and the labels say
          so rather than pretending to be one number. */}
      <div className="subtle" style={{ marginTop: 4 }}>
        Engagements made per day, last fortnight
      </div>
      <VBars data={eng.daily.map(x => ({
               key: x.date, label: x.label, count: x.count, now: x.is_today,
               title: `${x.label}: ${x.count} engaged`,
             }))}
             series={[{ key: "count", label: "Engaged", color: "var(--s-ENGAGED)" }]}/>

      <h3 style={{ marginTop: 20, fontSize: 14 }}>Today</h3>
      {!eng.today.length
        ? <div className="subtle" style={{ padding: "8px 0" }}>Nobody has been engaged today yet.</div>
        : <div className="scroll"><table>
            <thead><tr><th>Person</th><th>Vendor</th><th>Put forward as</th><th>Engagement</th><th>At</th></tr></thead>

              <td><b>{r.person_name}</b></td>
              <td>{r.vendor_name}</td>
              <td>{r.role || <span className="subtle">—</span>}
                {r.requirement_code &&
                  <div className="subtle mono" style={{ fontSize: 11.5 }}>{r.requirement_code}</div>}
              </td>
              <td>{r.engagement_label || <span className="subtle">—</span>}</td>
              <td className="mono" style={{ fontSize: 12 }}>{clockAt(r.engagement_start)}</td>
            </tr>)}</tbody>
          </table></div>}

      {!!eng.earlier.length && <>
        <h3 style={{ marginTop: 18, fontSize: 14 }}>
          Earlier
          <span className="subtle">still engaged, started before today</span>
        </h3>
        <div className="scroll"><table>
          <thead><tr><th>Person</th><th>Vendor</th><th>Put forward as</th><th>Engagement</th><th>Since</th></tr></thead>
          <tbody>{eng.earlier.map(r => <tr key={r.person_id + r.vendor_id}>
            <td><b>{r.person_name}</b></td>
            <td>{r.vendor_name}</td>
            <td>{r.role || <span className="subtle">—</span>}</td>
            <td>{r.engagement_label || <span className="subtle">—</span>}</td>
            <td className="subtle" style={{ fontSize: 12 }}>{dayOf(r.engagement_start)}</td>
          </tr>)}</tbody>
        </table></div>
        {eng.earlier_total > eng.earlier.length &&
          <div className="subtle" style={{ marginTop: 8 }}>
            Showing {eng.earlier.length} of {eng.earlier_total}.{" "}
            <button className="linky" onClick={() => go("vend")}>All of them in Vendor tracking →</button>
          </div>}
      </>}
    </div>

    <div className="dash-split">

      {/* ── 2 · what is held right now ────────────────────────────── */}
      <div className="card">
        <h3>
          Reserved now
          <span className="subtle">{res.total} held · soonest to lapse first</span>
        </h3>
        {!res.rows.length
          ? <div className="subtle" style={{ padding: "8px 0" }}>Nothing is reserved right now.</div>
          : <div className="scroll" style={{ marginTop: 8 }}><table>
              <thead><tr><th>Person</th><th>Vendor</th><th>Resume</th><th>Hold</th></tr></thead>
              <tbody>{res.rows.map(r => <tr key={r.person_id + r.vendor_id}>
                <td><b>{r.person_name}</b>
                  {r.role && <div className="subtle" style={{ fontSize: 11.5 }}>{r.role}</div>}

              </tr>)}</tbody>
            </table></div>}
        <div className="subtle" style={{ marginTop: 10 }}>
          A reserved hold is an approved resume waiting on a decision, and it lapses on its own
          {" "}clock. Nothing here changes one —{" "}

          {" "}Reservations board →</button>
        </div>
      </div>

      {/* ── 3 · vendors taken on this month ───────────────────────── */}
      <div className="card">
        <h3>
          New vendors
          <span className="subtle">{nv.month_label} · {nv.count} added</span>
        </h3>
        {/* The window is the calendar month, recomputed server-side on every
            request, so this empties by itself on the first. */}
        <div className="subtle" style={{ marginTop: 4 }}>Vendors added per month, last six</div>
        <VBars data={nv.monthly.map(m => ({
                 key: m.month, label: m.label, count: m.count, now: m.is_current,
                 title: `${m.label}: ${m.count} added`,
               }))}
               series={[{ key: "count", label: "Added", color: "var(--accent)" }]}/>
        {!nv.vendors.length
          ? <div className="subtle" style={{ marginTop: 14 }}>
              No vendors added in {nv.month_label}.
            </div>
          : <div className="scroll" style={{ marginTop: 14 }}><table>
              <thead><tr><th>Vendor</th><th>Contact</th><th>JDs</th><th>Profiles</th><th>Added</th></tr></thead>
              <tbody>{nv.vendors.map(v => <tr key={v.vendor_id}>
                <td>
                  <button className="linky" onClick={() => go("vend", v.vendor_id)}>{v.name}</button>
                  {!v.is_active && <span className="chip na" style={{ marginLeft: 6 }}>inactive</span>}
                </td>
                <td className="subtle">{v.contact_person || "—"}</td>
                <td>{v.requirements}</td>
                <td>{v.profiles}</td>
                <td className="subtle" style={{ fontSize: 12 }}>{dayOf(v.created_at)}</td>
              </tr>)}</tbody>
            </table></div>}
        {nv.count > nv.vendors.length &&
          <div className="subtle" style={{ marginTop: 8 }}>
            Showing {nv.vendors.length} of {nv.count}.
          </div>}
      </div>
    </div>

    <div className="dash-split even">

      {/* ── 4 · where every profile stands, per vendor ─────────────── */}
      <div className="card">
        <h3>
          Pipeline by vendor
          <span className="subtle">every (person, vendor) pair</span>
        </h3>
        {!d.pipeline_by_vendor.rows.length
          ? <div className="subtle" style={{ padding: "8px 0" }}>
              Nobody has been put forward to a vendor yet.
            </div>
          : <>
              <HStack rows={d.pipeline_by_vendor.rows.map(r => ({
                        key: r.vendor_id, name: r.vendor_name, total: r.total,
                        counts: r.counts, vendor_id: r.vendor_id,
                      }))}
                      series={STATUS_SERIES}
                      onRow={r => go("vend", r.vendor_id)}/>
              <Legend series={STATUS_SERIES}/>
              {/* The point of the picture: the same person can be a different
                  colour on two rows, because availability is keyed on the pair
                  rather than on the person. */}
              <div className="subtle" style={{ marginTop: 10 }}>
                Availability is per (person, vendor), so one person can be available on one row
                {" "}and engaged on the next.
              </div>
            </>}
      </div>

      {/* ── 5 · what came back from vendors ───────────────────────── */}
      <div className="card">
        <h3>
          Outcomes
          <span className="subtle">last 8 weeks</span>
        </h3>
        <VBars data={d.outcomes_weekly.map(w => ({
                 key: w.week_start, label: w.label, now: w.is_current,
                 submitted: w.submitted, engaged: w.engaged, rejected: w.rejected,
                 title: `w/c ${w.label} — sent ${w.submitted}, engaged ${w.engaged}, rejected ${w.rejected}`,
               }))}
               series={OUTCOME_SERIES}/>
        <Legend series={OUTCOME_SERIES}/>
        {/* Not a funnel on purpose: a rejection puts the profile back in that
            vendor's pool and a lapsed hold does the same, so the shape that
            describes this is a loop. */}
        <div className="subtle" style={{ marginTop: 10 }}>
          Counted per week from what actually happened, not drawn as a funnel — a rejection returns
          {" "}the profile to that vendor's pool, so the process is a loop rather than a narrowing.
        </div>
      </div>
    </div>

    {/* ── 6 · what JDs ask for against what the bank holds ───────── */}
    <div className="dashwide">
      <div className="card">
        <h3>
          Skill demand vs bench
          <span className="subtle">mandatory JD skills, most asked first</span>
        </h3>
        <div className="skillcols">
        {!d.skill_demand.rows.length
          ? <div className="subtle" style={{ padding: "8px 0" }}>
              No JD has named a mandatory skill yet.
            </div>
          : <div style={{ marginTop: 12 }}>
              {/* Both bars on one scale, so "asked for twice, held by one
                  person" is a gap you can see rather than one you work out. */}
              {(() => {
                const max = Math.max(1, ...d.skill_demand.rows.flatMap(x => [x.demand, x.supply]));
                return d.skill_demand.rows.map(r =>
                  <div className={"pair" + (r.supply < r.demand ? " short" : "")} key={r.technology}>
                  <div className="name">
                    <span>{r.technology}</span>
                    <b className="subtle">
                      {r.demand} JD{r.demand === 1 ? "" : "s"} · {r.supply} {r.supply === 1 ? "person" : "people"}
                    </b>
                  </div>
                  <div className="track" title={`Asked for by ${r.demand} JD(s)`}>
                    <i style={{ width: `${(r.demand / max) * 100}%`, background: "var(--s-demand)" }}/>
                  </div>
                  <div className="track" title={`${r.supply} in the bank`}>
                    <i style={{ width: `${(r.supply / max) * 100}%`, background: "var(--s-supply)" }}/>
                  </div>
                </div>);
              })()}
              <Legend series={[
                { key: "demand", label: "Asked for by JDs", color: "var(--s-demand)" },
                { key: "supply", label: "People in the bank", color: "var(--s-supply)" },
              ]}/>
            </div>}
        {!!d.skill_demand.unmatched.length &&
          /* The harder gap: not "few people have it" but "no such technology
             exists here", so no resume drawn from this bank could evidence it
             at all. Beside the bars rather than under them, because it answers
             the same question they do. */
          <div style={{ marginTop: 12 }}>
            <div className="subtle">
              Asked for by a JD and matching no technology on record — nothing in the bank can
              {" "}evidence these:
            </div>
            <div className="gapchips">
              {d.skill_demand.unmatched.map(u =>
                <span className="chip crit" key={u.skill}>{u.skill} · {u.count}</span>)}
            </div>
          </div>}
        </div>
      </div>
    </div>

    <Err e={e}/>
  </div>;
}

/* ══════════════════════════════ routing ══════════════════════════════

   Where you are is in the URL, so the back button, a refresh and a pasted
   link all work. Before this, every screen was the same address and none of
   the three did.

   The route lives in the hash rather than the path. The UI is served by
   StaticFiles, which resolves one real file per request: "/app/studio/<id>"
   is not a file on disk, so a pushState address would 404 the moment anybody
   refreshed it or opened it from a message — which is most of the reason to
   put it in the URL at all. A hash is never sent to the server, so every
   route survives both, and the app keeps working if it is ever mounted
   somewhere other than /app.

   One level of argument is enough for everything the app addresses: which
   session the studio has open, which pool the knowledge base is showing,
   which vendor is selected. */

/* `dash` is home: the bare /app/ entry, an unrecognised route and a signed-out
   session all land there. It is the one screen that says what is happening
   without being asked a question first — the Workspace is where you go once
   you already know what you want to do. */
const ROUTES = {
  dash:   "dashboard",
  work:   "workspace",
  studio: "studio",          // + /<session id>
  jd:     "jd",              // + /<requirement id>, for one JD's resumes
  kb:     "knowledge",       // + /<entity key: people, tech, projects, …>
  vend:   "vendor-tracking", // + /<vendor id>
  res:    "reservations",
  hist:   "history",
};
const TAB_FOR = Object.fromEntries(Object.entries(ROUTES).map(([tab, path]) => [path, tab]));

function parseHash() {
  const [head = "", arg = ""] = (location.hash || "").replace(/^#\/?/, "").split("/");
  return { tab: TAB_FOR[head] || "dash", arg: arg ? decodeURIComponent(arg) : "" };
}

const hashFor = (tab, arg) =>
  "#/" + (ROUTES[tab] || ROUTES.dash) + (arg ? "/" + encodeURIComponent(arg) : "");

/* ══════════════════════════════ shell ══════════════════════════════ */
function App() {
  const [authed,setAuthed] = useState(!!TOKEN);
  const [route,setRoute]   = useState(parseHash);
  // The session the studio last had open. Held apart from the route so the
  // Studio tab stays reachable while you look at another screen — the route
  // says where you are, this says what is still open.
  const [sid,setSid]       = useState(() => (parseHash().tab === "studio" ? parseHash().arg : null));
  const [me,setMe]         = useState(null);
  const {tab, arg} = route;

  // The hash is the single source of truth, so a back button, a pasted link
  // and a redirect all arrive through exactly one path.
  useEffect(() => {
    const sync = () => setRoute(parseHash());
    window.addEventListener("hashchange", sync);
    return () => window.removeEventListener("hashchange", sync);
  }, []);

  const go = (nextTab, nextArg) => { location.hash = hashFor(nextTab, nextArg); };

  // Give the bare /app/ entry an address, without adding a history entry
  // somebody would have to press back through to leave the app. That address
  // is the dashboard: opening the app should answer "what is happening"
  // before it asks "what do you want to do".
  useEffect(() => { if (!location.hash) location.replace(hashFor("dash")); }, []);

  const studioId = tab === "studio" ? (arg || sid) : null;
  useEffect(() => { if (arg && tab === "studio") setSid(arg); }, [tab, arg]);
  // A studio route with nothing to show — an old link to a session that has
  // been cleared — lands on the dashboard rather than on a blank pane.
  useEffect(() => {
    if (tab === "studio" && !studioId) location.replace(hashFor("dash"));
  }, [tab, studioId]);

  useEffect(()=>{ if(authed) api("/auth/me").then(setMe).catch(()=>{}); },[authed]);
  if (!authed) return <Login onIn={()=>setAuthed(true)}/>;

  const openStudio = id => go("studio", id);
  const signOut = () => { setToken(""); location.hash = hashFor("dash"); location.reload(); };

  return <div className="app">
    <div className="top">
      <div className="brand"><span className="mark">RF</span>RoleFit<small>JD-Driven Profile Allocation</small></div>
      <div className="tabs">
        <button className={tab==="dash"?"on":""}   onClick={()=>go("dash")}>Dashboard</button>
        <button className={tab==="work"?"on":""}   onClick={()=>go("work")}>Workspace</button>
        <button className={studioId?"on":""}       onClick={()=>sid&&go("studio",sid)} disabled={!sid}>Studio</button>
        <button className={tab==="jd"?"on":""}     onClick={()=>go("jd")}>JD</button>
        <button className={tab==="kb"?"on":""}     onClick={()=>go("kb")}>Knowledge base</button>
        <button className={tab==="vend"?"on":""}   onClick={()=>go("vend")}>Vendor tracking</button>
        <button className={tab==="res"?"on":""}    onClick={()=>go("res")}>Reservations</button>
        <button className={tab==="hist"?"on":""}   onClick={()=>go("hist")}>History</button>
      </div>
      <div className="who">
        <span className="email">{me?.email}</span>
        <button onClick={signOut}>Sign out</button>
      </div>
    </div>
    <main className={studioId?"nopad":""}>
      {/* Kept mounted rather than unmounted-on-leave: the workspace carries
          real unsaved work before a reservation exists — a profile picked, the
          shape form, missing-technology release years typed in. Hiding it
          instead of tearing it down means flipping to JD or Knowledge base to
          check something and coming back finds it exactly as it was. */}
      <div hidden={tab !== "work"}>
        <Workspace onStudio={openStudio}/>
      </div>
      {tab==="dash"  && <Dashboard go={go}/>}
      {studioId      && <Studio sessionId={studioId} onExit={()=>go("hist")}
                                onApproved={()=>{ setSid(null); go("res"); }}/>}
      {tab==="jd"    && <JDModule requirementId={arg||null} onSelect={id=>go("jd", id)}
                                  onBack={()=>go("jd")} onStudio={openStudio}/>}
      {tab==="kb"    && <Knowledge section={arg} onSection={s=>go("kb", s)}/>}
      {tab==="vend"  && <VendorTracking vendor={arg||null} onVendor={v=>go("vend", v)}
                                        onOpenStudio={openStudio}/>}
      {tab==="res"   && <ReservationsBoard onOpenStudio={openStudio}/>}
      {tab==="hist"  && <History onOpen={openStudio}/>}
    </main>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
