[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jd-resume-platform"
version = "0.1.0"
description = "JD-Driven Profile Allocation & AI Resume Generation Platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg2-binary>=2.9,<3",
    # Auth & security
    "python-jose[cryptography]>=3.4,<4",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=3.2,<4",
    # Validation & config
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.9,<3",
    "python-dotenv>=1.1,<2",
    "email-validator>=2.2,<3",
    # LLM providers
    "anthropic>=0.45,<1",
    "openai>=1.59,<2",
    "groq>=0.25,<1",
    # Document generation
    "python-docx>=1.1,<2",
    "lxml>=5.4,<6",
    # Deterministic LaTeX templating — an uploaded design is turned into a
    # Jinja template once, then every resume renders through it without a
    # model writing LaTeX per run (see app/services/template_blueprint.py).
    "jinja2>=3.1,<4",
    # Reading uploaded resumes (section: profile import)
    "pypdf>=5,<7",
    # Background tasks (optional at runtime — see CELERY_ENABLED)
    "celery>=5.4,<6",
    "redis>=5,<7",
    # Utilities
    "httpx>=0.28,<1",
    "orjson>=3.10,<4",
    "coloredlogs>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
    "httpx>=0.28,<1",
    "ruff>=0.6",
]
# LLM-as-judge quality eval (see eval/) — kept out of `dev` since it pulls a
# real model at run time and is never part of the default `pytest` run.
eval = [
    "deepeval>=4,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
